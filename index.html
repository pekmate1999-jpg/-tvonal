<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="app-version" content="1.3.0">
<title>Ágynemű futár</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--hd:#3a9d23;--nav:#e3f4bd;--navtx:#2b5d12}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#161d33;--tx:#e5e7eb;--mut:#9ca3af;--bd:#26304d;--ac:#3b82f6;--hd:#2d7a1a;--nav:#d9efa8;--navtx:#27510f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.pad{padding:12px}
.head{display:flex;gap:10px;align-items:center;padding:6px 12px 10px;cursor:pointer}
.done .nm{text-decoration:line-through;opacity:.6}
.done .plan b{color:var(--ok)}
.grow{flex:1;min-width:0}.small{font-size:13px}.mut{color:var(--mut)}
.body{padding:0 12px 12px;border-top:1px solid var(--bd)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:10px 0 2px}
.code{font:700 28px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;word-break:break-all}
.pre{white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn,button{appearance:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.bad{color:var(--bad)}
.on{outline:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.dis{opacity:.4;pointer-events:none}
.flex1{flex:1}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin-top:4px}
textarea{min-height:76px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;flex-direction:column;gap:0;font-size:12px;padding:10px 4px}
nav button.on{outline:0;color:var(--ac);background:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum div{padding:12px 4px}.sum b{display:block;font-size:22px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;max-width:616px;margin:0 auto;text-align:center}
h2{font-size:18px;margin:6px 2px 10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.top{background:var(--hd);color:#fff;padding:12px 14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .ttl{font-size:22px;font-weight:800}.top .sub{font-size:12px;opacity:.9}
.pill{background:rgba(0,0,0,.25);border-radius:14px;padding:4px 10px;text-align:center;font-weight:700;font-size:13px;line-height:1.2;flex:none}
.pill span{display:block;font-weight:500;font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.tile{padding:8px 3px;text-align:center;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.tile:nth-child(4n){border-right:0}.tile:nth-last-child(-n+4){border-bottom:0}
.tile i{font-style:normal;display:flex;align-items:center;justify-content:center;min-height:28px;font-size:11px;line-height:1.15;color:var(--mut)}
.tile b{font-size:17px}
.rnd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 4px 6px}
.plan{display:flex;justify-content:space-between;gap:8px;padding:10px 12px 0;font-size:13px;color:var(--mut)}
.plan b{color:var(--tx)}
.navbtn{background:var(--nav);color:var(--navtx);border-color:var(--nav);border-radius:99px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:1}
.acts{padding:0 12px 12px}
.depot{border-left:5px solid var(--hd)}
.warn{color:var(--warn)}
.bdg{display:inline-block;font-size:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn);border-radius:8px;padding:1px 7px;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.log{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.late{color:var(--bad);font-weight:700}.early{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav>
  <button data-act="tab" data-tab="today">📋<span>Ma</span></button>
  <button data-act="tab" data-tab="apts">🏠<span>Lakások</span></button>
  <button data-act="tab" data-tab="hist">📊<span>Előzmények</span></button>
  <button data-act="tab" data-tab="set">⚙️<span>Beállítás</span></button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== állapot ===== */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let apts=LS.get('apts',{}), today=LS.get('today',null), days=LS.get('days',[]);
const DEF={template:'{név} Kész',city:'Budapest',depotAddr:'Bajcsy-Zsilinszky út 35, Budapest',cap:0,stopMin:8,stripMin:12,reloadMin:15,dataUrl:''};
let cfg=Object.assign({},DEF,LS.get('cfg',{}));
let ui={tab:'today',open:null,edit:null,aptOpen:null,histOpen:null,q:'',paste:'',newVer:null};
const save=()=>{LS.set('apts',apts);LS.set('today',today);LS.set('days',days);LS.set('cfg',cfg)};
const APP_VERSION=(document.querySelector('meta[name=app-version]')||{}).content||'?';
const SCHEMA=2; // növeld, ha az adatformátum megváltozik, és írj hozzá átalakítót a migrate()-be
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pad2=n=>String(n).padStart(2,'0');
const fmtT=ms=>new Date(ms).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
const fmtDur=ms=>{const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return h?`${h} ó ${m%60} p`:`${m} p`};
const hm=ms=>{const m=Math.max(0,Math.round(ms/60000));return pad2(Math.floor(m/60))+':'+pad2(m%60)};
const fmtKm=k=>k.toFixed(1).replace('.',',')+' km';
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;
function toast(m,sticky){const t=$('#toast');clearTimeout(toastT);if(!m){t.style.display='none';return}t.textContent=m;t.style.display='block';if(!sticky)toastT=setTimeout(()=>t.style.display='none',4500)}
function safeRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;render()}

/* ===== raktár-tételek, adatmigráció ===== */
function mkDepot(kind){return{id:uid(),type:'depot',kind,name:kind==='end'?'Vissza a mosodába':'Újratöltés',status:'pending',cleaner:null}}
function ensureEnd(){
  if(!today)return;
  const ends=today.stops.filter(s=>s.type==='depot'&&s.kind==='end');
  const pendingEnd=ends.some(s=>s.status!=='done');
  const pendingOther=today.stops.some(s=>s.status!=='done'&&!(s.type==='depot'&&s.kind==='end'));
  if(!pendingEnd&&(!ends.length||pendingOther))today.stops.push(mkDepot('end'));
}
function migrate(){
  const from=LS.get('schema',0);
  if(from>=SCHEMA)return;
  try{localStorage.setItem('backup_before_schema_'+SCHEMA,JSON.stringify({apts,today,days,cfg,at:Date.now()}))}catch(e){}
  if(from<2)ensureEnd(); // v1.2: a mai listához végállomás (raktár)
  LS.set('schema',SCHEMA);save();
}

/* ===== üzenet feldolgozása ===== */
function parseMsg(t){
  let date=null;const names=[];
  for(let line of t.split(/\r?\n/)){
    line=line.trim();if(!line||line.startsWith('@'))continue;
    const m=line.match(/^(\d{4})\.\s?(\d{2})\.\s?(\d{2})/);
    if(m){date=`${m[1]}-${m[2]}-${m[3]}`;continue}
    const n=line.replace(/[^\p{L}\p{N}\s.\-]/gu,'').replace(/\s+/g,' ').trim();
    if(n)names.push(n);
  }
  return{date,names};
}
function findApt(name){
  const k=norm(name);if(!k)return null;
  if(apts[k])return apts[k];
  const c=Object.values(apts).filter(a=>norm(a.name).startsWith(k));
  return c.length===1?c[0]:null;
}
const getApt=s=>s.type==='depot'?null:findApt(s.name);
function aptKey(s){const a=getApt(s);return a?norm(a.name):norm(s.name)}

/* ===== geokódolás, távolságok, útvonal ===== */
let lastGeo=0;const geoFail=new Map();
function simplifyAddr(a){
  const s=String(a).replace(/^\s*\d{4}\s*,?\s*/,'');
  const m=s.match(/^(.*?\d+(?:\s?[A-Za-z])?)(?=[\s,./]|$)/);
  return m?m[1]:s;
}
async function geocode(a){
  if(!a||!a.address)return false;
  if(a.lat&&a.geoAddr===a.address)return true;
  if(Date.now()-(geoFail.get(a.address)||0)<6e5)return false;
  const tries=[a.address];const sm=simplifyAddr(a.address);if(sm&&sm!==a.address)tries.push(sm);
  for(const t of tries){
    const w=Math.max(0,1100-(Date.now()-lastGeo));if(w)await sleep(w);lastGeo=Date.now();
    const q=(/budapest/i.test(t)||!cfg.city)?t:t+', '+cfg.city;
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=hu&accept-language=hu&q='+encodeURIComponent(q));
      const j=await r.json();
      if(j[0]){a.lat=+j[0].lat;a.lon=+j[0].lon;a.geoAddr=a.address;return true}
    }catch(e){}
  }
  geoFail.set(a.address,Date.now());
  return false;
}
async function depotPos(){
  if(cfg.depotLat&&cfg.depotGeo===cfg.depotAddr)return{lat:cfg.depotLat,lon:cfg.depotLon};
  const t={address:cfg.depotAddr};
  if(await geocode(t)){cfg.depotLat=t.lat;cfg.depotLon=t.lon;cfg.depotGeo=cfg.depotAddr;save();return{lat:t.lat,lon:t.lon}}
  return null;
}
async function itemPos(s,D){
  if(s.type==='depot')return D;
  const a=getApt(s);
  if(a&&a.address&&await geocode(a))return{lat:a.lat,lon:a.lon};
  return null;
}
const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dLa=t(b.lat-a.lat),dLo=t(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function matrix(pts){
  try{
    const c=pts.map(p=>p.lon+','+p.lat).join(';');
    const r=await fetch(`https://router.project-osrm.org/table/v1/driving/${c}?annotations=duration`);
    const j=await r.json();
    if(j.code==='Ok'&&j.durations&&!j.durations.flat().includes(null))return{d:j.durations,real:true};
  }catch(e){}
  return{d:pts.map(a=>pts.map(b=>hav(a,b)*1.3/30*3600)),real:false};
}
async function legsOf(wp){ // wp: legalább 2 pont → [{km,min,approx}]
  if(wp.length<2)return[];
  try{
    const c=wp.map(p=>p.lon+','+p.lat).join(';');
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${c}?overview=false`);
    const j=await r.json();
    if(j.code==='Ok'&&j.routes&&j.routes[0]&&j.routes[0].legs.length===wp.length-1)
      return j.routes[0].legs.map(l=>({km:l.distance/1000,min:l.duration/60,approx:false}));
  }catch(e){}
  return wp.slice(1).map((p,i)=>{const k=hav(wp[i],p)*1.3;return{km:k,min:k/30*60,approx:true}});
}
async function legKm(from,to){const L=await legsOf([from,to]);return{km:L[0].km,approx:L[0].approx}}
// start -> nodes -> end legrövidebb sorrend (start==end: zárt kör), 2-opt + több kezdőpont
function solvePath(d,start,end,nodes){
  const n=nodes.length;
  if(n<2)return nodes.slice();
  const cost=o=>{let s=d[start][o[0]];for(let i=1;i<o.length;i++)s+=d[o[i-1]][o[i]];return s+d[o[o.length-1]][end]};
  const twoOpt=o=>{
    let c=cost(o),imp=true;
    while(imp){imp=false;
      for(let i=0;i<o.length-1;i++)for(let j=i+1;j<o.length;j++){
        const cand=o.slice(0,i).concat(o.slice(i,j+1).reverse(),o.slice(j+1)),cc=cost(cand);
        if(cc<c-1e-9){o=cand;c=cc;imp=true}
      }}
    return[o,c];
  };
  const nn=first=>{
    const left=new Set(nodes),o=[];let l=start;
    if(first!=null){o.push(first);left.delete(first);l=first}
    while(left.size){let b=null,bd=Infinity;for(const x of left)if(d[l][x]<bd){bd=d[l][x];b=x}o.push(b);left.delete(b);l=b}
    return o;
  };
  let best=null,bc=Infinity;
  for(const f of(n<=25?[null,...nodes]:[null])){const[o,c]=twoOpt(nn(f));if(c<bc){bc=c;best=o}}
  return best;
}
// Körökre bontás: kapacitás (csomag/kör), vagy a meglévő újratöltések száma alapján
function splitRounds(list,used,cap,nRounds){
  const pk=s=>s.packs||1;
  if(cap>0){
    const out=[[]];let load=used;
    for(const s of list){
      const p=pk(s);
      if(load+p>cap&&(out[out.length-1].length||load>0)){out.push([]);load=0}
      out[out.length-1].push(s);load+=p;
    }
    return out;
  }
  const n=Math.max(1,nRounds),tot=list.reduce((a,s)=>a+pk(s),0),target=tot/n;
  const out=Array.from({length:n},()=>[]);let c=0;
  for(const s of list){const p=pk(s);out[Math.min(n-1,Math.floor((c+p/2)/target))].push(s);c+=p}
  const res=out.filter(x=>x.length);
  return res.length?res:[[]];
}
const svcMs=s=>s.type==='depot'?(s.kind==='reload'?cfg.reloadMin:0)*6e4:(cfg.stopMin+(s.cleaner==='strip'?cfg.stripMin:0))*6e4;

async function optimize(){
  if(!today)return;
  const pending=today.stops.filter(s=>s.status!=='done'&&s.type!=='depot');
  const reloads=today.stops.filter(s=>s.status!=='done'&&s.type==='depot'&&s.kind==='reload').length;
  if(!pending.length){toast('Nincs több lakás a listán');return}
  toast('Raktár címének keresése…',1);
  const D=await depotPos();
  if(!D){toast('A raktár címét nem találom – ellenőrizd a Beállításokban');return}
  const ok=[],bad=[];let i=0;
  for(const s of pending){
    toast(`Címek keresése ${++i}/${pending.length}…`,1);
    const a=getApt(s);
    if(a&&a.address&&await geocode(a))ok.push(s);else bad.push(s);
  }
  if(!today)return;
  save();toast('Útvonal számítása…',1);
  const doneItems=today.stops.filter(s=>s.status==='done').sort((a,b)=>a.doneAt-b.doneAt);
  const lastDone=doneItems[doneItems.length-1];
  const cur=lastDone&&lastDone.type!=='depot'&&lastDone.pos?lastDone.pos:null;
  let used=0;for(let k=doneItems.length-1;k>=0&&doneItems[k].type!=='depot';k--)used+=doneItems[k].packs||1;
  let rounds=[[]];
  if(ok.length){
    const pts=[D,...(cur?[cur]:[]),...ok.map(getApt)];
    const off=cur?2:1,sIdx=cur?1:0;
    const{d}=await matrix(pts);
    const nodeOf=new Map(ok.map((s,k)=>[s,k+off]));
    const tour=solvePath(d,sIdx,0,ok.map((_,k)=>k+off));
    const list=tour.map(x=>ok[x-off]);
    const chunks=splitRounds(list,cur?used:0,cfg.cap,reloads+1);
    rounds=chunks.map((c,k)=>solvePath(d,k===0?sIdx:0,0,c.map(s=>nodeOf.get(s))).map(x=>ok[x-off]));
  }
  if(!today)return;
  const endItem=today.stops.find(s=>s.type==='depot'&&s.kind==='end'&&s.status!=='done')||mkDepot('end');
  const stops=[...doneItems];
  rounds.forEach((c,k)=>{if(k>0)stops.push(mkDepot('reload'));stops.push(...c)});
  stops.push(...bad,endItem);
  stops.forEach(s=>{if(s.status!=='done'){delete s.legPlanMin;delete s.legPlanKm;delete s.legPlanEta;delete s.svcPlanMin}});
  today.stops=stops;today.planAt=0;save();
  await replan();
  const nR=today.stops.filter(s=>s.type==='depot').length;
  const mins=today.endEta?Math.round((today.endEta-Date.now())/60000):null;
  toast(`Kész · ${nR} kör${today.remKm?` · ~${Math.round(today.remKm)} km`:''}${mins!=null?` · ~${mins} perc`:''}${today.planApprox?' (becslés)':''}${bad.length?` · ⚠ ${bad.length} lakásnak nincs/nem található címe`:''}`);
}

/* ===== ütemezés: tervezett érkezések, hátralévő út ===== */
let planning=false,again=false;
async function replan(){
  if(!today)return;
  if(planning){again=true;return}
  planning=true;
  try{do{again=false;await doPlan()}while(again&&today)}catch(e){}
  planning=false;
  if(today){today.planAt=Date.now();save();safeRender()}
}
async function doPlan(){
  if(!today)return;
  const stops=today.stops,pend=stops.filter(s=>s.status!=='done');
  const D=await depotPos();
  const dn=stops.filter(s=>s.status==='done'&&s.pos).sort((a,b)=>b.doneAt-a.doneAt)[0];
  const from=dn?dn.pos:D;
  if(!from||!pend.length){today.remKm=0;today.endEta=null;return}
  const wp=[from],items=[];
  for(const s of pend){
    const p=await itemPos(s,D);if(!today)return;
    if(p){wp.push(p);items.push(s)}else{s.eta=null;s.planKm=null;s.planMin=null}
  }
  if(!items.length){today.remKm=0;today.endEta=null;return}
  const legs=await legsOf(wp);if(!today)return;
  let t=Date.now(),km=0,ap=false;
  items.forEach((s,i)=>{const L=legs[i];km+=L.km;ap=ap||L.approx;s.planKm=L.km;s.planMin=L.min;t+=L.min*6e4;s.eta=t;t+=svcMs(s)});
  today.remKm=km;today.planApprox=ap;
  pend.forEach((s,i)=>{if(i>0){delete s.legPlanMin;delete s.legPlanKm;delete s.legPlanEta;delete s.svcPlanMin}});
  const f0=pend[0];
  if(f0&&f0.planMin!=null&&f0.legPlanEta==null){f0.legPlanMin=f0.planMin;f0.legPlanKm=f0.planKm;f0.legPlanEta=f0.eta;f0.svcPlanMin=svcMs(f0)/6e4}
  const last=items[items.length-1];
  today.endEta=(last.type==='depot'&&last.kind==='end')?last.eta:t;
}

/* ===== munka / műszak ===== */
function newDay(names,date,append){
  const stops=names.map(n=>({id:uid(),name:n,status:'pending',cleaner:null,packs:1}));
  if(append&&today){
    const have=new Set(today.stops.filter(s=>s.type!=='depot').map(s=>norm(s.name)));
    const fresh=stops.filter(s=>!have.has(norm(s.name)));
    const ei=today.stops.findIndex(s=>s.type==='depot'&&s.kind==='end'&&s.status!=='done');
    today.stops.splice(ei<0?today.stops.length:ei,0,...fresh);
  }else{
    today={date:date||ld(),startedAt:null,endedAt:null,startPoint:null,stops};
  }

let filling=false,fillAgain=false;
async function fillLegs(){
  if(!today)return;
  if(filling){fillAgain=true;return}
  filling=true;
  try{
    do{
      fillAgain=false;
      const D=await depotPos();
      const dn=today.stops.filter(s=>s.status==='done'&&s.doneAt).sort((a,b)=>a.doneAt-b.doneAt);
      let prev=null,ch=false;
      for(const s of dn){
        if(!s.pos){const p=await itemPos(s,D);if(p){s.pos=p;ch=true}}
        if(s.legKm==null&&s.pos){
          const from=prev?prev.pos:(today.startPoint||D);
          if(from){const r=await legKm(from,s.pos);s.legKm=r.km;s.approx=r.approx;ch=true}
        }
        prev=s;
      }
      if(ch){save();safeRender()}
    }while(fillAgain&&today);
  }catch(e){}
  filling=false;
}

const mins=ms=>Math.round(ms/60000);
const sgn=ms=>{const m=mins(ms);return(m>0?'+':m<0?'−':'±')+Math.abs(m)+' p'};
function visitInfo(s){
  const ls=s.legStartAt;
  return{
    drive:(s.arrivedAt&&ls)?Math.max(0,s.arrivedAt-ls):null,          // tényleges út (indulástól megérkezésig)
    onsite:(s.arrivedAt&&s.doneAt)?Math.max(0,s.doneAt-s.arrivedAt):null, // helyszíni idő
    cycle:(s.doneAt&&ls)?Math.max(0,s.doneAt-ls):null,                 // út + helyszín együtt
    delay:(s.arrivedAt&&s.legPlanEta)?s.arrivedAt-s.legPlanEta:null,   // késés a tervezett érkezéshez képest
    planDrive:s.legPlanMin!=null?s.legPlanMin*6e4:null
  };
}
function logLine(s){
  const v=visitInfo(s),p=[];
  if(s.arrivedAt)p.push(`📍 érkezés ${fmtT(s.arrivedAt)}`+(s.legPlanEta?` (terv ${fmtT(s.legPlanEta)}, <span class="${v.delay>2*6e4?'late':'early'}">${sgn(v.delay)}</span>)`:''));
  if(v.drive!=null)p.push(`🚗 út ${mins(v.drive)} p`+(v.planDrive!=null?` (terv ${mins(v.planDrive)} p, ${sgn(v.drive-v.planDrive)})`:''));
  if(v.onsite!=null)p.push(`⏱ ott ${mins(v.onsite)} p`);
  if(v.cycle!=null&&v.drive==null)p.push(`⏱ út+ott ${mins(v.cycle)} p`);
  if(s.legKm!=null)p.push(`${s.approx?'~':''}${fmtKm(s.legKm)}`+(s.legPlanKm?` (terv ${fmtKm(s.legPlanKm)})`:''));
  return p.join(' · ');
}
function histSummary(t){
  const dn=t.stops.filter(s=>s.status==='done'),V=dn.map(s=>({s,v:visitInfo(s)}));
  const apt=V.filter(x=>x.s.type!=='depot'),dep=V.filter(x=>x.s.type==='depot');
  const sum=(a,f)=>a.reduce((n,x)=>n+(f(x)||0),0);
  const avg=(a,f)=>a.length?sum(a,f)/a.length:0;
  const L=[];
  L.push(`📦 ${sum(apt,x=>x.s.packs||1)} csomag · ${apt.length} lakás · 🔄 ${dep.filter(x=>x.s.kind==='reload').length} újratöltés`);
  const drv=V.filter(x=>x.v.drive!=null),both=drv.filter(x=>x.v.planDrive!=null);
  if(drv.length)L.push(`🚗 Vezetés: ${fmtDur(sum(drv,x=>x.v.drive))}`+(both.length?` (terv ${fmtDur(sum(both,x=>x.v.planDrive))}, ${sgn(sum(both,x=>x.v.drive-x.v.planDrive))})`:'')+` · átlag ${mins(avg(drv,x=>x.v.drive))} p / út`);
  const on=apt.filter(x=>x.v.onsite!=null);
  if(on.length)L.push(`⏱ Lakásokban: ${fmtDur(sum(on,x=>x.v.onsite))} · átlag ${mins(avg(on,x=>x.v.onsite))} p / lakás`);
  const st=on.filter(x=>x.s.cleaner==='strip'),cl=on.filter(x=>x.s.cleaner==='done');
  if(st.length||cl.length)L.push([cl.length?`✅ takarító kész: ${cl.length} db, átl. ${mins(avg(cl,x=>x.v.onsite))} p`:'',st.length?`🧺 lehúzás: ${st.length} db, átl. ${mins(avg(st,x=>x.v.onsite))} p`:''].filter(Boolean).join(' · '));
  const dOn=dep.filter(x=>x.v.onsite!=null);
  if(dOn.length)L.push(`🏭 Raktárban: ${fmtDur(sum(dOn,x=>x.v.onsite))}`);
  const kmA=sum(dn,s=>s.legKm),bk=dn.filter(s=>s.legKm!=null&&s.legPlanKm!=null);
  if(kmA)L.push(`📏 ${fmtKm(kmA)}`+(bk.length?` · terv/tény az összehasonlítható utaknál: ${fmtKm(sum(bk,s=>s.legPlanKm))} / ${fmtKm(sum(bk,s=>s.legKm))}`:''));
  const ms=(t.endedAt||Math.max(...dn.map(s=>s.doneAt),0))-(t.startedAt||0);
  if(t.startedAt&&apt.length&&ms>5*6e4)L.push(`⚡ ${(apt.length/(ms/3.6e6)).toFixed(1).replace('.',',')} lakás / óra`);
  return`<div class="small" style="line-height:1.7;padding-top:8px">${L.join('<br>')}</div>`;
}

/* ===== Excel / CSV import + napi adatbázis-frissítés ===== */
const RX={addr:/c[ií]m|address|utca/i,code:/k[oó]d|bel[eé]p|code|pin|kulcs/i,door:/ajt[oó]|emelet|door|lak[aá]ssz[aá]m|szint/i,help:/seg[eé]d|bejut|le[ií]r|[uú]tmutat|megjegyz|info|egy[eé]b/i,name:/n[eé]v|lak[aá]s|apartman|megnevez|azonos/i};
function importRows(rows){
  rows=rows.filter(r=>r.some(c=>String(c).trim()));
  let hi=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){
    const cells=rows[i].map(String);
    if(cells.filter(c=>c.trim()).length>=2&&cells.some(c=>RX.addr.test(c)||RX.name.test(c))){hi=i;break}
  }
  let map={name:[0],addr:[1],code:[2],door:[],help:[3],rest:[]},hdr=[];
  if(hi>=0){
    hdr=rows[hi].map(c=>String(c).trim());map={name:[],addr:[],code:[],door:[],help:[],rest:[]};
    hdr.forEach((h,i)=>{
      if(!h)return;
      if(RX.addr.test(h))map.addr.push(i);
      else if(RX.code.test(h))map.code.push(i);
      else if(RX.door.test(h))map.door.push(i);
      else if(RX.help.test(h))map.help.push(i);
      else if(RX.name.test(h)&&!map.name.length)map.name.push(i);
      else map.rest.push(i);
    });
    if(!map.name.length){map.name=[map.rest.shift()??0]}
  }
  const has=k=>map[k].length>0;
  const join=(r,cols)=>cols.map(c=>{const v=String(r[c]??'').trim();if(!v)return'';return(cols.length>1&&hdr[c])?`${hdr[c]}: ${v}`:v}).filter(Boolean).join('\n');
  let n=0,changed=0;
  for(const r of rows.slice(hi+1)){
    const name=String(r[map.name[0]]??'').trim();if(!name)continue;
    const k=norm(name);if(!k)continue;
    const extra=map.rest.map(c=>{const v=String(r[c]??'').trim();return v?`${hdr[c]||''}: ${v}`:''}).filter(Boolean).join('\n');
    const nv={};
    if(has('addr'))nv.address=join(r,map.addr).replace(/\n/g,', ');
    if(has('code'))nv.code=join(r,map.code);
    if(has('door'))nv.door=join(r,map.door);
    const helpTxt=[has('help')?join(r,map.help):'',extra].filter(Boolean).join('\n');
    if(has('help')||extra)nv.help=helpTxt;
    const old=apts[k];
    const base=old||{address:'',code:'',door:'',help:'',note:''};
    const upd={...base,...nv,name};
    if(old&&nv.code!==undefined&&old.code&&nv.code&&old.code!==nv.code){upd.prevCode=old.code;upd.codeChanged=Date.now();changed++}
    if(old&&nv.address!==undefined&&old.address!==nv.address){delete upd.lat;delete upd.lon;delete upd.geoAddr}
    apts[k]=upd;n++;
  }
  return{n,changed};
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');
  const first=t.split(/\r?\n/)[0]||'';
  const d=[';','\t',','].map(c=>[c,first.split(c).length-1]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function importBuffer(buf){
  const u=new Uint8Array(buf);
  const bin=(u[0]===0x50&&u[1]===0x4B)||(u[0]===0xD0&&u[1]===0xCF);
  let sets;
  if(bin){
    if(typeof XLSX==='undefined')throw new Error('Az Excel-olvasó nem töltődött be (nincs net?)');
    const wb=XLSX.read(u,{type:'array'});
    sets=wb.SheetNames.map(nm=>XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:'',raw:false}));
  }else{
    let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){txt=new TextDecoder('windows-1250').decode(u)}
    if(/^\s*<(!doctype|html)/i.test(txt))throw new Error('a link nem táblázatot adott vissza – ellenőrizd a megosztást');
    sets=[parseCSV(txt)];
  }
  const r={n:0,changed:0};
  for(const rows of sets){const x=importRows(rows);r.n+=x.n;r.changed+=x.changed}
  if(!r.n)throw new Error('nem találtam lakás-sorokat a táblázatban');
  LS.set('dataAt',Date.now());
  return r;
}
async function importFile(f){
  try{
    const r=importBuffer(await f.arrayBuffer());
    save();render();toast(`${r.n} lakás betöltve${r.changed?` · 🔄 ${r.changed} kód változott`:''}`);
  }catch(e){toast('Nem sikerült beolvasni: '+e.message)}
}
function gsUrl(u){
  const m=u.match(/docs\.google\.com\/spreadsheets\/d\/(?!e\/)([\w-]+)/);
  if(m&&!/\/pub/.test(u)){const g=u.match(/[#?&]gid=(\d+)/);return`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g?'&gid='+g[1]:''}`}
  return u;
}

  else h+=`<div class="acts"><div class="row" style="margin-top:0"><a class="btn flex1" href="${viber}">💬 Viber</a></div></div>`;
  if(open){
    h+='<div class="body">';
    if(recent)h+=`<div class="lbl">Kód változás</div><div class="small">Régi kód: <s>${esc(a.prevCode)}</s></div>`;
    if(a&&a.code)h+=`<div class="lbl">Belépő kód</div><div class="code">${esc(a.code)}</div>`;
    if(a&&a.door)h+=`<div class="lbl">Ajtószám / emelet</div><div>${esc(a.door)}</div>`;
    if(a&&a.help)h+=`<div class="lbl">Bejutási segédlet</div><div class="pre">${esc(a.help)}</div>`;
    if(!a||!a.address||ui.edit===s.id){
      h+=`<div class="lbl">Cím</div><input data-f="address" ${fa} value="${esc(a?.address||'')}" placeholder="pl. Dohány utca 12">
      <div class="lbl">Ajtószám / emelet</div><input data-f="door" ${fa} value="${esc(a?.door||'')}">
      <div class="lbl">Kód</div><input data-f="code" ${fa} value="${esc(a?.code||'')}">
      <div class="lbl">Segédlet</div><textarea data-f="help" ${fa}>${esc(a?.help||'')}</textarea>`;
    }
    h+=`<div class="lbl">Csomag</div><div class="stepper"><button data-act="packs" data-id="${s.id}" data-d="-1">−</button><b>${s.packs||1}</b><button data-act="packs" data-id="${s.id}" data-d="1">+</button>
      ${s.arrivedAt?`<span class="tag">📍 ${fmtT(s.arrivedAt)}</span>`:`<button data-act="arrive" data-id="${s.id}">📍 Megérkeztem</button>`}</div>
    <div class="lbl">Takarító</div>
    <div class="row" style="margin-top:0"><button class="flex1 ${s.cleaner==='done'?'on':''}" data-act="cleaner" data-id="${s.id}" data-v="done">✅ Végzett</button>
    <button class="flex1 ${s.cleaner==='strip'?'on':''}" data-act="cleaner" data-id="${s.id}" data-v="strip">🧺 Lehúzom</button></div>
    <div class="lbl">Megjegyzés (a lakáshoz mentve)</div>
    <textarea data-f="note" ${fa}>${esc(a?.note||'')}</textarea>
    <div class="lbl">Mai megjegyzés (csak erre a napra, a naplóba kerül)</div>
    <textarea data-vnote="${s.id}">${esc(s.vnote||'')}</textarea>
    <div class="row">${done?`<button class="flex1" data-act="undo" data-id="${s.id}">↩ Visszavon</button>`:`<button class="flex1" data-act="reloadAfter" data-id="${s.id}">🔄 Újratöltés ez után</button>`}</div>
    <div class="row">${done?'':`<button data-act="move" data-id="${s.id}" data-d="-1">▲</button><button data-act="move" data-id="${s.id}" data-d="1">▼</button>`}
      <button data-act="edit" data-id="${s.id}">✏️ Adatok</button><button class="bad" data-act="del" data-id="${s.id}">✕ Törlés</button></div>`;
    h+='</div>';
  }
  return h+'</div>';
}
function viewToday(){
  let h=topBar();
  if(!today)return h+pasteBox(false);
  const stops=today.stops,apt=stops.filter(s=>s.type!=='depot'),dep=stops.filter(s=>s.type==='depot');
  const st=dayStats(today),ap=today.planApprox?'~':'';
  const nxt=stops.find(s=>s.status!=='done');
  const T=(l,v,id)=>`<div class="tile"><i>${l}</i><b${id?` id="${id}"`:''}>${v}</b></div>`;
  h+=`<div class="tiles">
  ${T('Hátralévő út',today.remKm!=null?ap+Math.round(today.remKm)+' km':'–')}
  ${T('Hátralévő idő',today.endEta?hm(today.endEta-Date.now()):'–','rem')}
  ${T('Raktárba érkezés',today.endEta?fmtT(today.endEta):'–')}
  ${T('Következő lakásra',nxt&&nxt.planMin!=null?Math.round(nxt.planMin)+' p':'–')}
  ${T('Fennmaradó lakások',apt.filter(s=>s.status!=='done').length)}
  ${T('Körök',dep.length?Math.min(dep.length,dep.filter(s=>s.status==='done').length+1)+'/'+dep.length:'–')}
  ${T('Megtett út',st.km?(st.approx?'~':'')+fmtKm(st.km):'–')}
  ${T('Eltelt idő',today.startedAt?hm(st.ms):'–','clock')}
  </div>`;
  h+=`<div class="row" style="margin:0 0 10px">${!today.startedAt?'<button class="okb flex1" data-act="start">▶ Munka indítása</button>':'<button class="bad flex1" data-act="end">⏹ Munka vége</button>'}
  <button class="pri flex1" data-act="optimize">🧭 Útvonal újratervezése</button></div>`;
  const pend=stops.filter(s=>s.status!=='done');
  const doneL=stops.filter(s=>s.status==='done').sort((a,b)=>a.doneAt-b.doneAt);
  let r=doneL.filter(s=>s.type==='depot').length+1,startRound=true;
  const roundPacks=i=>{let t=0;for(let j=i;j<pend.length&&pend[j].type!=='depot';j++)t+=pend[j].packs||1;return t};
  pend.forEach((s,i)=>{
    if(startRound&&s.type!=='depot'){h+=`<div class="rnd">${r}. kör · 📦 ${roundPacks(i)} csomag</div>`;startRound=false}
    h+=stopCard(s);
    if(s.type==='depot'){r++;startRound=true}
  });
  if(!pend.length)h+='<div class="card pad">🎉 Minden tétel kész. Nyomd meg a „Munka vége” gombot.</div>';
  if(doneL.length)h+=`<div class="rnd">✔ Elkészült (${doneL.length}) · a legutóbbi van legalul</div>`+doneL.map(s=>stopCard(s)).join('');
  return h+pasteBox(true);
}
function aptListHtml(){
  const q=norm(ui.q);
  const list=Object.entries(apts).filter(([k])=>!q||k.includes(q)).sort((a,b)=>a[1].name.localeCompare(b[1].name,'hu'));
  if(!list.length)return'<div class="mut pad">Még nincs lakás. Töltsd be az Excelt vagy adj hozzá egyet.</div>';
  return list.map(([k,a])=>{
    const open=ui.aptOpen===k,fa=`data-key="${esc(k)}" data-name="${esc(a.name)}"`;
    const recent=a.codeChanged&&Date.now()-a.codeChanged<14*864e5;
    return`<div class="card"><div class="head" style="padding-top:10px" data-act="aptOpen" data-key="${esc(k)}"><div class="grow"><b>${esc(a.name)}</b>${recent?' <span class="bdg">🔄 új kód</span>':''}
      <div class="mut small">${a.address?esc(a.address):'⚠ nincs cím'}${a.door?' · '+esc(a.door):''}</div></div><span class="mut">${open?'▲':'▼'}</span></div>
      ${open?`<div class="body"><div class="lbl">Cím</div><input data-f="address" ${fa} value="${esc(a.address)}">
      <div class="lbl">Ajtószám / emelet</div><input data-f="door" ${fa} value="${esc(a.door||'')}">
      <div class="lbl">Kód</div><input data-f="code" ${fa} value="${esc(a.code)}">
      <div class="lbl">Segédlet</div><textarea data-f="help" ${fa}>${esc(a.help)}</textarea>
      <div class="lbl">Megjegyzés</div><textarea data-f="note" ${fa}>${esc(a.note||'')}</textarea>
      <div class="row"><button class="bad" data-act="aptDel" data-key="${esc(k)}">✕ Lakás törlése</button></div></div>`:''}</div>`}).join('');
}
function viewApts(){
  const n=Object.keys(apts).length,miss=Object.values(apts).filter(a=>!a.address).length,ds=dataStatus();
  return`<h2>Lakások <span class="mut small">${n} db${miss?` · ${miss} cím nélkül`:''}</span></h2>
  <div class="card pad"><div class="lbl" style="margin-top:0">Adatbázis: ${ds.ok?'✅':'⚠'} ${esc(ds.txt)}</div>
  ${cfg.dataUrl?'<div class="row" style="margin-top:6px"><button class="pri flex1" data-act="syncNow">🔄 Frissítés a linkről</button></div>':'<div class="mut small">Automatikus napi frissítéshez add meg az adatbázis linkjét a Beállításokban.</div>'}
  <div class="lbl">Excel / CSV betöltése</div>
  <input type="file" id="xl" accept=".xlsx,.xls,.csv,.ods">
  <div class="mut small" style="margin-top:6px">Az oszlopokat a fejléc alapján ismeri fel (név, cím, ajtó, kód, segédlet). Betöltéskor a cím/kód/segédlet frissül, a megjegyzéseid megmaradnak. Ha egy kód megváltozik, jelzi.</div></div>
  <div class="row" style="margin:0 0 10px"><input id="q" placeholder="Keresés…" value="${esc(ui.q)}" style="margin:0;flex:1"><button data-act="aptNew">+ Új</button></div>
  <div id="aptlist">${aptListHtml()}</div>`;
}
function viewHist(){
  let h=`<h2>Előzmények</h2><div class="row" style="margin:0 0 10px"><button class="flex1" data-act="csv">⬇ Napló exportja (CSV / Excel)</button></div>`;
  if(!days.length)return h+'<div class="mut pad">Még nincs lezárt nap.</div>';
  const tot=days.map(dayStats),tk=tot.reduce((a,t)=>a+t.km,0),tm=tot.reduce((a,t)=>a+t.ms,0);
  h+=`<div class="card sum"><div><b>${days.length}</b><span class="mut small">nap</span></div><div><b>${fmtDur(tm)}</b><span class="mut small">összes idő</span></div><div><b>${fmtKm(tk)}</b><span class="mut small">összes km</span></div></div>`;
  days.forEach((d,i)=>{
    const s=tot[i],open=ui.histOpen===i;
    h+=`<div class="card"><div class="head" style="padding-top:10px" data-act="histOpen" data-i="${i}"><div class="grow"><b>${esc(d.date)}</b>
      <div class="mut small">${s.done}/${s.total} lakás · ${fmtDur(s.ms)} · ${s.approx?'~':''}${fmtKm(s.km)}</div></div><span class="mut">${open?'▲':'▼'}</span></div>`;
    if(open){
      const items=[...d.stops.filter(x=>x.status==='done').sort((a,b)=>a.doneAt-b.doneAt),...d.stops.filter(x=>x.status!=='done')];
      h+='<div class="body">'+histSummary(d)+items.map(x=>{
        const nm=x.type==='depot'?'🏭 '+(x.kind==='end'?'Vissza a mosodába':'Újratöltés'):esc(x.name);
        const cl=x.cleaner==='done'?'✅ takarító kész':x.cleaner==='strip'?'🧺 lehúzás':'';
        return`<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><b>${nm}</b> ${cl}${x.type!=='depot'?` · 📦 ${x.packs||1}`:''}${x.round?` · ${x.round}. kör`:''}
        <div class="mut small">${x.status==='done'?`${fmtT(x.doneAt)} kész${x.addr?' · '+esc(x.addr):''}`:'nem lett kész'}</div>
        ${x.status==='done'?`<div class="log">${logLine(x)}</div>`:''}${x.vnote?`<div class="small">📝 ${esc(x.vnote)}</div>`:''}</div>`}).join('')+
      `<div class="row"><button class="bad" data-act="histDel" data-i="${i}">✕ Nap törlése</button></div></div>`;
    }
    h+='</div>';
  });
  return h;
}
function viewSet(){
  const num=(k,l)=>`<div class="lbl">${l}</div><input data-cfg="${k}" data-num="1" type="number" inputmode="numeric" min="0" value="${esc(cfg[k])}">`;
  return`<h2>Beállítások</h2><div class="card pad">
  <div class="lbl" style="margin-top:0">Raktár / mosoda címe (felvétel és szennyes leadás)</div><input data-cfg="depotAddr" value="${esc(cfg.depotAddr)}">
  ${num('cap','Autó kapacitása (csomag / kör, 0 = nincs korlát)')}
  ${num('stopMin','Várakozás lakásonként (perc)')}
  ${num('stripMin','Extra idő, ha nekem kell lehúzni (perc)')}
  ${num('reloadMin','Újratöltés ideje a raktárban (perc)')}
  <div class="lbl">Viber üzenet sablon ({név} = lakás neve)</div><input data-cfg="template" value="${esc(cfg.template)}">
  <div class="lbl">Város (ha a cím nem tartalmazza)</div><input data-cfg="city" value="${esc(cfg.city)}"></div>
  <div class="card pad"><div class="lbl" style="margin-top:0">Adatbázis automatikus frissítése (link)</div>
  <input data-cfg="dataUrl" value="${esc(cfg.dataUrl)}" placeholder="https://… (CSV / Excel / Google Táblázat link)">
  <div class="mut small" style="margin-top:6px">Ha megadod, az app minden megnyitáskor és új nap betöltésekor letölti a friss címeket és kódokat. Tartsd titokban a linket: aki ismeri, látja a táblázatot.</div>
  <div class="row"><button class="flex1" data-act="syncNow">🔄 Frissítés most</button></div></div>
  <div class="card pad"><div class="lbl" style="margin-top:0">Biztonsági mentés</div>
  <div class="row" style="margin-top:4px"><button class="flex1" data-act="export">⬇ Mentés (JSON)</button></div>
  <input type="file" id="bk" accept=".json" style="margin-top:8px">
  <div class="mut small" style="margin-top:6px">${lastBackupTxt()} Az adatok csak ebben a böngészőben vannak tárolva. Böngészőadat törlése előtt ments!</div></div>
  <div class="card pad"><div class="lbl" style="margin-top:0">Verzió</div><b>${esc(APP_VERSION)}</b>
  <div class="row"><button class="flex1" data-act="checkUpdate">🔄 Frissítések keresése</button></div>
  <div class="mut small" style="margin-top:6px">A frissítés nem törli az adataidat.</div></div>`;
}
async function checkUpdate(silent){
  try{
    const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(/name="app-version" content="([^"]+)"/);
    if(!m){if(!silent)toast('Nem sikerült ellenőrizni');return}
    if(m[1]===APP_VERSION){if(!silent)toast('A legfrissebb verziót használod ('+APP_VERSION+')');return}
    if(silent){ui.newVer=m[1];safeRender();return}
    save();toast('Frissítés: '+m[1]+'…',1);await sleep(500);
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }catch(e){if(!silent)toast('Nincs net, nem sikerült ellenőrizni')}
}
function lastBackupTxt(){const t=LS.get('lastBackup',0);return t?`Utolsó mentés: ${new Date(t).toLocaleDateString('hu-HU')}.`:'Még nem volt mentés.'}
function banners(){
  let h='';
  const ds=dataStatus();
  if(Object.keys(apts).length&&!ds.ok)h+=`<div class="card pad" style="border-color:var(--warn)">⚠ <b>Az adatbázis nem mai</b> (${esc(ds.txt)}). A belépőkódok időközben változhattak!
    <div class="row">${cfg.dataUrl?'<button class="pri flex1" data-act="syncNow">🔄 Frissítés most</button>':'<button class="pri flex1" data-act="tab" data-tab="apts">📂 Új Excel betöltése</button>'}</div></div>`;
  if(ui.newVer)h+=`<div class="card pad" style="border-color:var(--ac)">🆕 Új verzió érhető el (${esc(ui.newVer)}). Az adataid megmaradnak.<div class="row"><button class="pri flex1" data-act="update">🔄 Frissítés most</button></div></div>`;
  const lb=LS.get('lastBackup',0);
  if(Object.keys(apts).length&&Date.now()-lb>7*864e5)h+=`<div class="card pad">💾 ${lb?'Több mint egy hete nem volt mentés.':'Még nem készült mentés.'}<div class="row"><button class="flex1" data-act="export">⬇ Mentés most</button></div></div>`;
  return h;
}
function render(){
  $('#app').innerHTML=banners()+(ui.tab==='today'?viewToday():ui.tab==='apts'?viewApts():ui.tab==='hist'?viewHist():viewSet());
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
}
setInterval(()=>{
  if(!today)return;
  const c=$('#clock');if(c&&today.startedAt&&!today.endedAt)c.textContent=hm(Date.now()-today.startedAt);
  const r=$('#rem');if(r&&today.endEta)r.textContent=hm(today.endEta-Date.now());
},15000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(today){fillLegs();if(Date.now()-(today.planAt||0)>3*60000)replan()}
  if(cfg.dataUrl&&Date.now()-lastSyncTry>30*60000)syncData(false);
});

/* ===== események ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const d=el.dataset,act=d.act,stop=d.id&&today?today.stops.find(s=>s.id===d.id):null;
  if(act==='nav'){if(stop&&!stop.navAt){stop.navAt=Date.now();save()}return}
  if(act==='tab'){ui.tab=d.tab;render();return}
  if(act==='toggle'){ui.open=ui.open===d.id?null:d.id;ui.edit=null;render();return}
  if(act==='load'){
    const{date,names}=parseMsg($('#paste').value);
    if(!names.length){toast('Nem találtam lakásneveket');return}
    if(d.mode==='new'&&today&&!confirm('Van folyamatban lévő nap. Eldobod és újat kezdesz? (Lezárni a „Munka vége” gombbal tudod mentéssel.)'))return;
    ui.paste='';loadDay(names,date,d.mode==='add');return;
  }
  if(act==='start'){startShift();return}
  if(act==='end'){endShift();return}
  if(act==='optimize'){optimize();return}
  if(act==='syncNow'){syncData(true);return}
  if(act==='arrive'&&stop){stop.arrivedAt=Date.now();ui.open=stop.id;save();render();return}
  if(act==='cleaner'&&stop){stop.cleaner=stop.cleaner===d.v?null:d.v;stop.cleanerAt=stop.cleaner?Date.now():null;save();render();replan();return}
  if(act==='packs'&&stop){stop.packs=Math.max(1,(stop.packs||1)+(+d.d));save();render();return}
  if(act==='done'&&stop){markDone(stop.id);return}
  if(act==='doneViber'&&stop){markDone(stop.id);location.href='viber://forward?text='+encodeURIComponent(cfg.template.replace('{név}',stop.name));return}
  if(act==='csv'){exportCSV();return}
  if(act==='undo'&&stop){stop.status='pending';delete stop.doneAt;delete stop.legKm;delete stop.approx;delete stop.round;save();render();replan();return}
  if(act==='edit'&&stop){ui.edit=ui.edit===stop.id?null:stop.id;render();return}
  if(act==='del'&&stop){
    if(confirm((stop.type==='depot'?'Az újratöltés':stop.name)+' törlése a mai listáról?')){today.stops=today.stops.filter(s=>s!==stop);save();render();replan()}return;
  }
  if(act==='move'&&stop){
    const idx=today.stops.map((s,i)=>s.status!=='done'?i:-1).filter(i=>i>=0);
    const p=idx.indexOf(today.stops.indexOf(stop)),q=p+(+d.d);
    if(p>=0&&q>=0&&q<idx.length){const i=idx[p],j=idx[q];[today.stops[i],today.stops[j]]=[today.stops[j],today.stops[i]];save();render();replan()}
    return;
  }
  if(act==='reloadAfter'&&stop){
    const i=today.stops.indexOf(stop);
    today.stops.splice(i+1,0,mkDepot('reload'));save();render();replan();
    toast('Újratöltés beszúrva ez után – a „Útvonal újratervezése” gomb újraosztja a köröket');return;
  }
  if(act==='aptOpen'){ui.aptOpen=ui.aptOpen===d.key?null:d.key;render();return}
  if(act==='aptDel'){if(confirm('Törlöd a lakást?')){delete apts[d.key];ui.aptOpen=null;save();render()}return}
  if(act==='aptNew'){
    const n=prompt('Új lakás neve:');if(!n)return;
    const k=norm(n);if(!k)return;
    apts[k]=apts[k]||{name:n.trim(),address:'',code:'',door:'',help:'',note:''};ui.aptOpen=k;save();render();return;
  }
  if(act==='histOpen'){ui.histOpen=ui.histOpen===+d.i?null:+d.i;render();return}
  if(act==='histDel'){if(confirm('Törlöd ezt a napot?')){days.splice(+d.i,1);ui.histOpen=null;save();render()}return}
  if(act==='update'||act==='checkUpdate'){checkUpdate(false);return}
  if(act==='export'){
    LS.set('lastBackup',Date.now());const b=new Blob([JSON.stringify({apts,days,cfg,today},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agynemu-futar-mentes-'+ld()+'.json';a.click();render();return;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.f){
    const k=t.dataset.key;
    if(!apts[k])apts[k]={name:t.dataset.name||k,address:'',code:'',door:'',help:'',note:''};
    apts[k][t.dataset.f]=t.value.trim();
    if(t.dataset.f==='address'){delete apts[k].lat;delete apts[k].lon;delete apts[k].geoAddr}
    save();return;
  }
  if(t.dataset.vnote){const s=today&&today.stops.find(x=>x.id===t.dataset.vnote);if(s){s.vnote=t.value.trim();save()}return}
  if(t.dataset.cfg){const k=t.dataset.cfg;cfg[k]=t.dataset.num?(Number(t.value)||0):t.value.trim();save();return}
  if(t.id==='xl'&&t.files[0]){await importFile(t.files[0]);return}
  if(t.id==='bk'&&t.files[0]){
    try{
      const j=JSON.parse(await t.files[0].text());
      if(!confirm('A mentés felülírja a mostani adatokat. Folytatod?'))return;
      apts=j.apts||{};days=j.days||[];cfg=Object.assign({},DEF,cfg,j.cfg||{});if(j.today)today=j.today;ensureEnd();save();render();toast('Visszaállítva');
    }catch(err){toast('Hibás fájl')}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;$('#aptlist').innerHTML=aptListHtml()}
  if(e.target.id==='paste')ui.paste=e.target.value;
});
migrate();
render();
if(navigator.onLine){
  checkUpdate(true);
  if(cfg.dataUrl)syncData(false);
  if(today){replan();fillLegs()}
}
</script>
