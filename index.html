<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="app-version" content="1.22.5">
<title>Ágynemű futár</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--hd:#3a9d23;--nav:#e3f4bd;--navtx:#2b5d12}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#161d33;--tx:#e5e7eb;--mut:#9ca3af;--bd:#26304d;--ac:#3b82f6;--hd:#2d7a1a;--nav:#d9efa8;--navtx:#27510f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.pad{padding:12px}
.head{display:flex;gap:10px;align-items:center;padding:6px 12px 10px;cursor:pointer}
.done .nm{text-decoration:line-through;opacity:.6}
.done .plan b{color:var(--ok)}
.grow{flex:1;min-width:0}.small{font-size:13px}.mut{color:var(--mut)}
.body{padding:0 12px 12px;border-top:1px solid var(--bd)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:10px 0 2px}
.code{font:700 28px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;word-break:break-all}
.pre{white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn,button{appearance:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.bad{color:var(--bad)}
.on{outline:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.dis{opacity:.4;pointer-events:none}
.flex1{flex:1}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin-top:4px}
textarea{min-height:76px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;flex-direction:column;gap:0;font-size:12px;padding:10px 4px}
nav button.on{outline:0;color:var(--ac);background:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum div{padding:12px 4px}.sum b{display:block;font-size:22px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;max-width:616px;margin:0 auto;text-align:center}
h2{font-size:18px;margin:6px 2px 10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.top{background:var(--hd);color:#fff;padding:12px 14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .ttl{font-size:22px;font-weight:800}.top .sub{font-size:12px;opacity:.9}
.pill{background:rgba(0,0,0,.25);border-radius:14px;padding:4px 10px;text-align:center;font-weight:700;font-size:13px;line-height:1.2;flex:none}
.pill span{display:block;font-weight:500;font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.tile{padding:8px 3px;text-align:center;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.tile:nth-child(4n){border-right:0}.tile:nth-last-child(-n+4){border-bottom:0}
.tile i{font-style:normal;display:flex;align-items:center;justify-content:center;min-height:28px;font-size:11px;line-height:1.15;color:var(--mut)}
.tile b{font-size:17px}
.rnd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 4px 6px}
.plan{display:flex;justify-content:space-between;gap:8px;padding:10px 12px 0;font-size:13px;color:var(--mut)}
.plan b{color:var(--tx)}
.navbtn{background:var(--nav);color:var(--navtx);border-color:var(--nav);border-radius:99px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:1}
.acts{padding:0 12px 12px}
.depot{border-left:5px solid var(--hd)}
.warn{color:var(--warn)}
.bdg{display:inline-block;font-size:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn);border-radius:8px;padding:1px 7px;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.log{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.late{color:var(--bad);font-weight:700}.early{color:var(--ok);font-weight:700}
.cl{font:600 13px/1.45 ui-monospace,Menlo,monospace;margin-top:4px}
.code.m{font-size:20px}
.sm{padding:7px 8px!important;font-size:14px!important;font-weight:600;min-height:0!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.sec{border-top:1px solid var(--bd);margin-top:10px;padding-top:8px}
.codes2{display:flex;gap:14px;flex-wrap:wrap}.codes2>div{flex:1 1 auto;min-width:0}.codes2 .code{word-break:normal}
.info{display:flex;gap:6px;align-items:flex-start;padding:6px 8px;border-radius:10px;background:rgba(127,127,127,.1);margin-top:6px}.info .tx{flex:1;white-space:pre-wrap}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{border:0!important;border-radius:0!important;flex:1}.mono{font-family:ui-monospace,Menlo,monospace}
.old{font-size:11px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:0 5px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.modal{background:var(--card);color:var(--tx);border-radius:18px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal .mt{font-size:21px;font-weight:800}.modal button{padding:16px;font-size:17px}
.warnb{background:var(--warn);color:#fff;border-color:var(--warn)}
.keyban{border:2px solid var(--bad)!important;background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.same{font-size:12px;background:color-mix(in srgb,var(--hd) 15%,var(--card));color:var(--tx);border-radius:8px;padding:1px 7px;font-weight:700}
.urg{border:2px solid var(--bad)!important}
.ubdg{font-size:12px;background:var(--bad);color:#fff;border-radius:8px;padding:1px 7px;font-weight:800}
.ibdg{font-size:12px;background:color-mix(in srgb,var(--warn) 20%,var(--card));color:var(--warn);border-radius:8px;padding:1px 7px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:8px 10px;font-size:14px;font-weight:600}
.dl{font-size:13px;padding:8px 12px;border-radius:12px;margin:0 0 10px;background:var(--card);border:1px solid var(--bd)}
.dl.bad{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.issue{border-left:4px solid var(--warn);padding:6px 8px;margin-top:8px;background:color-mix(in srgb,var(--warn) 8%,var(--card));border-radius:6px}
.mon{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px}.mon b{font-size:16px}
.todo{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--bd)}
.todo button{padding:6px 10px}.todo .tx{flex:1;min-width:0;padding-top:4px}
.tbdg{font-size:12px;background:color-mix(in srgb,var(--ac) 18%,var(--card));color:var(--ac);border-radius:8px;padding:1px 7px;font-weight:800}
.pack{border:2px solid var(--ac)}
.fuel{font-size:13px;line-height:1.6}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.mgrid input{margin:0;font-size:18px;text-align:right}.mgrid .lbl{margin:0}
#map{height:62vh;min-height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--bd);margin-bottom:10px;background:#dfe7d8}
.pin{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font:800 12px system-ui,sans-serif;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);white-space:nowrap}
.pin.next{background:var(--ok);width:36px;height:36px;font-size:14px}.pin.done{background:#9ca3af}.pin.urg{background:var(--bad)}
.pin.warn{border:3px dashed var(--warn)}.pin.dep{background:#2f7d1a;border-radius:8px}.pin.me{background:#0ea5e9;width:18px;height:18px}
.pin.wide{border-radius:14px;padding:0 6px;width:auto;min-width:28px}
.leaflet-popup-content{font:14px/1.4 system-ui,sans-serif;margin:10px 12px}.leaflet-popup-content .btn,.leaflet-popup-content button{padding:7px 10px;font-size:13px;margin-top:6px}
.legend{font-size:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.dlb{font-size:12px;border-radius:8px;padding:1px 7px;font-weight:800;background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--tx)}
.dlb.late{background:var(--bad);color:#fff}.dlb.free{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}.dlb.appt{background:#8b5cf6;color:#fff}
.dlrow{padding:2px 12px 0;display:flex;gap:6px;flex-wrap:wrap}
.prev{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-height:150px;overflow:auto}
.modal{max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal>*{flex-shrink:0} /* különben a hosszú ablakban az elemek (pl. az üzenet) összenyomódnak */
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav>
  <button data-act="tab" data-tab="today">📋<span>Ma</span></button>
  <button data-act="tab" data-tab="map">🗺<span>Térkép</span></button>
  <button data-act="tab" data-tab="apts">🏠<span>Lakások</span></button>
  <button data-act="tab" data-tab="hist">📊<span>Előzmények</span></button>
  <button data-act="tab" data-tab="set">⚙️<span>Beállítás</span></button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== állapot ===== */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let apts=LS.get('apts',{}), today=LS.get('today',null), days=LS.get('days',[]), keysHeld=LS.get('keysHeld',[]);
const DEF={template:'{név} kész',msgStyle:'short',city:'Budapest',depotAddr:'Bajcsy-Zsilinszky út 35, Budapest',cap:0,stopMin:8,stripMin:12,reloadMin:15,dataUrl:'',deadline:'15:00'};
let cfg=Object.assign({},DEF,LS.get('cfg',{}));
if(!cfg.alias||typeof cfg.alias!=='object')cfg.alias={};
if(!cfg.mergeAddr||typeof cfg.mergeAddr!=='object')cfg.mergeAddr={};
let ui={tab:'today',open:null,edit:null,aptOpen:null,histOpen:null,q:'',paste:'',newVer:null};
let matchCache=new Map();
const save=()=>{matchCache.clear();LS.set('keysHeld',keysHeld);LS.set('apts',apts);LS.set('today',today);LS.set('days',days);LS.set('cfg',cfg)};
const APP_VERSION=(document.querySelector('meta[name=app-version]')||{}).content||'?';
const SCHEMA=5; // növeld, ha az adatformátum megváltozik, és írj hozzá átalakítót a migrate()-be
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pad2=n=>String(n).padStart(2,'0');
const fmtT=ms=>new Date(ms).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
const fmtDur=ms=>{const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return h?`${h} ó ${m%60} p`:`${m} p`};
const hm=ms=>{const m=Math.max(0,Math.round(ms/60000));return pad2(Math.floor(m/60))+':'+pad2(m%60)};
const fmtKm=k=>k.toFixed(1).replace('.',',')+' km';
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;
function toast(m,sticky){const t=$('#toast');clearTimeout(toastT);if(!m){t.style.display='none';return}t.textContent=m;t.style.display='block';if(!sticky||sticky>1)toastT=setTimeout(()=>t.style.display='none',sticky>1?sticky:4500)}
function safeRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;render()}

/* ===== raktár-tételek, adatmigráció ===== */
function mkDepot(kind){return{id:uid(),type:'depot',kind,name:kind==='end'?'Vissza a mosodába':'Újratöltés',status:'pending',cleaner:null}}
function ensureEnd(){
  if(!today)return;
  const ends=today.stops.filter(s=>s.type==='depot'&&s.kind==='end');
  const pendingEnd=ends.some(s=>s.status!=='done');
  const pendingOther=today.stops.some(s=>s.status!=='done'&&!(s.type==='depot'&&s.kind==='end'));
  if(!pendingEnd&&(!ends.length||pendingOther))today.stops.push(mkDepot('end'));
}
function migrate(){
  const from=LS.get('schema',0);
  if(from>=SCHEMA)return;
  try{localStorage.setItem('backup_before_schema_'+SCHEMA,JSON.stringify({apts,today,days,cfg,at:Date.now()}))}catch(e){}
  if(from<2)ensureEnd();
  if(from<5&&cfg.template==='{név} Kész')cfg.template='{név} kész'; // v1.15: a csoport stílusa
  if(from<4&&!apts.BARLAI)apts.BARLAI={name:'Barlai',address:'Budapest II. kerület, Fillér utca 26',apptMin:60,note:'',manual:{address:true},aliases:[]}; // v1.13: időpontos program
  if(from<3){for(const t of [...days,...(today?[today]:[])])for(const s of t.stops)if(s.type!=='depot'&&!s.cleaner)s.cleaner='done'} // v1.10: a takarító alapból végzett // v1.2: a mai listához végállomás (raktár)
  LS.set('schema',SCHEMA);save();
}

/* ===== üzenet feldolgozása ===== */
// a név utáni rész: „Nincs foglalás” | „15:00” | „17:00-18:00” | „13:00-ig érj ide!”
function parseInfo(s){
  s=String(s||'').trim();
  if(/nincs\s*fogl|bármikor|barmikor/i.test(s))return{nobook:true,raw:s};
  // sáv: „17:00-18:00”, „17-18h”, „17h-18h”
  const r=s.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(?:h|óra)?\s*[-–]\s*(\d{1,2})(?:[:.](\d{2}))?\s*(?:h\b|óra)?/i);
  if(r&&(r[2]||r[4]||/h|óra/i.test(r[0]))&&+r[1]<24&&+r[3]<24)return{h:+r[1],m:+(r[2]||0),type:'done',label:`${pad2(r[1])}:${r[2]||'00'}–${pad2(r[3])}:${r[4]||'00'}`,raw:s};
  // egy időpont: „15:00”, „15.00”, „15h”, „15 óra”, „15:” (elírás), „13-ig”
  const t=s.match(/(\d{1,2})\s*(?:[:.]\s*(\d{2})|h\b|óra|ó\b|:(?!\s*\d)|-?ig\b)/i);
  if(t&&+t[1]<24){const mm=t[2]||'00',arrive=/[ée]rj|oda|ide\b|[ée]rkez/i.test(s);return{h:+t[1],m:+mm,type:arrive?'arrive':'done',label:`${pad2(t[1])}:${mm}${arrive?'-ig érj oda':''}`,raw:s}}
  return s?{raw:s}:null;
}
function parseMsg(t){
  let date=null;const names=[],urgent=[],info={};
  for(let line of String(t||'').split(/\r?\n/)){
    line=line.trim();if(!line||line.startsWith('@'))continue;
    const m=line.match(/^(\d{4})\.\s?(\d{2})\.\s?(\d{2})/);
    if(m){date=`${m[1]}-${m[2]}-${m[3]}`;continue}
    let np=line,ip='';
    const c=line.match(/^(.+?):\s+(.*)$/);
    if(c){np=c[1];ip=c[2]}
    else{const k=line.search(/\d{1,2}[:.]\d{2}|\b\d{1,2}\s*h\b|nincs\s+fogl|[ée]rj\s+ide|bármikor/i);if(k>0){np=line.slice(0,k);ip=line.slice(k)}}
    const u=/!|⚡|❗|‼|s[üu]rg[őo]s/i.test(np);
    const n=np.replace(/s[üu]rg[őo]s/ig,'').replace(/[^\p{L}\p{N}\s.\-]/gu,'').replace(/\s+/g,' ').trim();
    if(!n)continue;
    names.push(n);if(u)urgent.push(n);
    const I=parseInfo(ip);if(I)info[norm(n)]=I;
  }
  if(date&&Math.abs(Date.parse(date+'T12:00:00')-Date.parse(ld()+'T12:00:00'))>1.5*864e5){info.__datefix=date;date=ld()}
  return{date,names,urgent,info};
}
const hhmm=ms=>{const d=new Date(ms);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const atTime=(dateStr,h,m)=>{const d=new Date((dateStr||ld())+'T00:00:00');d.setHours(h,m,0,0);return d.getTime()};
// határidő egy lakáshoz: üzenetből, különben az alap (Beállítások, 15:00)
function dlFor(n,info,date){
  const I=info&&info[norm(n)];
  if(I&&I.nobook)return{nobook:true,info:I.raw};
  if(I&&I.h!=null)return{dl:{at:atTime(date,I.h,I.m),type:I.type,label:I.label},info:I.raw};
  const def=deadlineMs(date||ld());
  return def?{dl:{at:def,type:'done',label:cfg.deadline,def:true},...(I?{info:I.raw}:{})}:(I?{info:I.raw}:{});
}
/* Viber-név → táblázat-név: pontos, kézi összerendelés, segédlet-név (pl. „Holló bejutási infók”),
   majd betű-előtag + azonos sorszám (DOHÁNY-2 → DOH-2, KÁROLY-1 → KAR-1, NYÁRY → NYA) */
const splitKey=k=>{const m=String(k).match(/^([A-Z]+?)(\d*)$/);return m?{L:m[1],D:m[2]}:null};
function pickKey(c){const act=c.filter(([,a])=>!a.old),l=act.length?act:c;return l.length===1?l[0][0]:null}
function fuzzyKey(k){
  const E=Object.entries(apts);
  let c=E.filter(([,a])=>(a.aliases||[]).includes(k));
  if(c.length){const r=pickKey(c);if(r)return r}
  const s=splitKey(k);
  if(s&&s.L.length>=3){
    c=E.filter(([key,a])=>[key,...(a.aliases||[])].some(x=>{const t=splitKey(x);return t&&t.D===s.D&&t.L.length>=3&&(t.L.startsWith(s.L)||s.L.startsWith(t.L))}));
    if(c.length){const r=pickKey(c);if(r)return r}
  }
  c=E.filter(([key])=>key.startsWith(k));
  return c.length?pickKey(c):null;
}
function findApt(name){
  const k=norm(name);if(!k)return null;
  const al=cfg.alias[k];if(al&&apts[al])return apts[al];
  if(apts[k])return apts[k];
  if(!matchCache.has(k))matchCache.set(k,fuzzyKey(k));
  const r=matchCache.get(k);return r?apts[r]:null;
}
const getApt=s=>s.type==='depot'?null:findApt(s.members?s.members[0]:s.name);
function aptKey(s){const a=getApt(s);return a?norm(a.name):norm(s.name)}

/* ===== geokódolás, távolságok, útvonal ===== */
let lastGeo=0;const geoFail=new Map();
/* Címtisztítás: „1074 Budapest, Jósika u. 5. 1. emelet 8” → „1074 Budapest, Jósika utca 5” (+ kerület az irányítószámból) */
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII'];

function parseAddr(addr){

  const pcm=s.match(/(?:^|[\s,])(1\d{3})(?=[\s,.]|$)/);

  t=t.replace(/\bu\.(?=[\s,\d]|$)/gi,'utca ').replace(/\bkrt\.?(?=[\s,\d]|$)/gi,'körút ').replace(/\bút\./gi,'út ').replace(/\btér\./gi,'tér ').replace(/\s+/g,' ').trim();

  street=street.charAt(0).toUpperCase()+street.slice(1);
  const district=pc?String(+pc.slice(1,3)):rkd>0?String(rkd):'';
  const town=(pc||/budapest/i.test(s))?'Budapest':(cfg.city||'');

}
const GEO_V=3; // 3: csak házszámra pontos találat számít pontosnak
function geoMatches(res,p){
  const ad=res.address||{},txt=[ad.city,ad.town,ad.city_district,ad.district,ad.suburb,ad.borough,res.display_name].join(' ');
  if(p.town==='Budapest'&&!/budapest/i.test(txt))return false;
  if(!p.district)return true;
  const pc=String(ad.postcode||'').replace(/\D/g,'');
  if(/^1\d{3}$/.test(pc))return String(+pc.slice(1,3))===p.district;   // kerület = irányítószám 2-3. jegye
  return new RegExp('(^|[\\s,(])'+p.roman+'\\.\\s*kerület','i').test(txt);
}
const isHouse=r=>!!((r.address&&r.address.house_number)||/^(building|house)$/.test(r.addresstype||'')||r.type==='house');
// házszám-változatok: „31-33a” → 31, 33, 33a, 33/a · „59/A” → 59/A, 59, 59A
function numVariants(num){
  const out=[],add=x=>{x=String(x||'').trim();if(x&&!out.includes(x))out.push(x)};
  const s=String(num||'').replace(/\s+/g,'');
  const nums=s.match(/\d+/g)||[];const let_=(s.match(/[A-Za-z]$/)||[''])[0];
  if(!nums.length)return out;
  if(/[-–]/.test(s)){add(nums[0]);add(nums[1]);if(let_){add(nums[1]+let_.toLowerCase());add(nums[1]+'/'+let_.toLowerCase())}}
  else{add(s);if(let_){add(nums[0]+'/'+let_.toUpperCase());add(nums[0]+let_.toLowerCase())}add(nums[0])}

}
async function nomi(params){

async function geocode(a){
  if(!a||!a.address)return false;
  if(a.lat&&a.geoAddr===a.address&&(a.geoManual||a.geoV===GEO_V))return true;
  if(Date.now()-(geoFail.get(a.address)||0)<6e5)return false;

    for(const v of V)tries.push({street:v+' '+p.street,city:p.town,...pcP});
    for(const v of V.slice(0,2))tries.push({q:`${p.street} ${v}, ${p.pc?p.pc+' ':''}${p.town}`});
    if(p.roman&&V[0])tries.push({q:`${p.street} ${V[0]}, ${p.town} ${p.roman}. kerület`});
  }
  tries.push({q:a.address});

    try{
      const res=((await nomi(t))||[]).filter(r=>geoMatches(r,p));
      const house=res.find(isHouse);
      if(house)return take(house,true);
      if(!street&&res[0])street=res[0];
    }catch(e){}
  }

  geoFail.set(a.address,Date.now());
  return false;
}
const pkKey=addr=>norm(addr||'');

}

const ll6=p=>p.lon.toFixed(6)+','+p.lat.toFixed(6);
// élő forgalmi mátrix: a driving-traffic legfeljebb 10 pontot enged egy kérésben → 5×5-ös blokkok
async function mbMatrix(pts){
  const n=pts.length,B=5,d=pts.map(()=>Array(n).fill(null));
  for(let i=0;i<n;i+=B)for(let j=0;j<n;j+=B){
    const S=[],D=[];for(let k=i;k<Math.min(n,i+B);k++)S.push(k);for(let k=j;k<Math.min(n,j+B);k++)D.push(k);

    if(U.length<2){S.forEach(si=>D.forEach(dj=>{d[si][dj]=0}));continue} // egyetlen pont önmagához: 0 (a Mapbox legalább 2 pontot kér)
    const base=`${MB}/directions-matrix/v1/mapbox/driving-traffic/${U.map(k=>ll6(pts[k])).join(';')}?sources=${S.map(k=>U.indexOf(k)).join(';')}&destinations=${D.map(k=>U.indexOf(k)).join(';')}&annotations=duration`;

function mergeStops(lead){
  const k=addrKeyOf(lead);if(!k||!today)return 0;
  const grp=today.stops.filter(s=>s.status!=='done'&&s.type!=='depot'&&addrKeyOf(s)===k);
  if(grp.length<2)return 0;

  [...grp].sort((a,b)=>(a.ord??1e9)-(b.ord??1e9)).forEach(s=>members.push(...(s.members||[s.name]))); // az üzenet sorrendjében

const COLS=[
  ['skip',/min[oő]s[ií]t|[aá]remel|^rules$|^info$|^[aá]fa$|^ifa$/i],
  ['wifi2',/m[aá]sodlagos\s*wi-?fi/i],
  ['wifi',/wi-?fi/i],
  ['pass',/jelsz/i],
  ['vacuum',/porsz/i],
  ['keySpot',/takar[ií]t[oó]s|kulcs\s*helye|lakat/i],
  ['spare',/p[oó]tkulcs/i],
  ['gate',/kapu/i],
  ['code',/kulcs[oő]r|ajt[oó]k[oó]d|k[oó]d|bel[eé]p|code|pin/i],
  ['help',/bejut|seg[eé]d|le[ií]r[aá]s|[uú]tmutat/i],
  ['guest',/vend[eé]g|sabee/i],
  ['addr',/c[ií]m|address|utca/i],
  ['door',/ajt[oó]sz|emelet|door|szint/i],
  ['extra',/megjegyz|egy[eé]b/i],
  ['name',/lak[aá]s|n[eé]v|apartman|megnevez|azonos/i]

const CODE_FIELDS=['gate','code','spare','keySpot'];
const FL={gate:'Kapukód',code:'Kulcsőr / ajtókód',spare:'Pótkulcsőr',keySpot:'Takarítós kulcs helye',address:'Cím',door:'Ajtó',help:'Segédlet',helpUrl:'Segédlet link'};
const colType=h=>{h=String(h||'').trim();if(!h)return null;for(const[f,rx]of COLS)if(rx.test(h))return f;return'?'};
const cleanV=v=>{v=String(v??'').replace(/\s+/g,' ').trim();if(/^-?\d+\.0+$/.test(v))v=v.replace(/\.0+$/,'');return /^[-–x]$/i.test(v)?'':v};
const helpAlias=t=>{const m=String(t||'').match(/^(.*?)\s*bejut\S*(\s+\S+)?\s*$/i);return m&&m[1].trim()?norm(m[1]):''};
function importRows(rows,opt){
  opt=opt||{};const seen=opt.seen||new Set();const T=r=>(r||[]).map(c=>typeof c==='object'&&c?c:{t:String(c??''),l:''});
  rows=rows.map(T);
  let hi=-1,map=null;
  for(let i=0;i<Math.min(15,rows.length);i++){
    const ty=rows[i].map(c=>colType(c.t));
    if(rows[i].some(c=>/\d{3,}/.test(c.t)))continue; // kódot / irányítószámot tartalmazó sor adat, nem fejléc
    if(ty.filter(x=>x&&x!=='?'&&x!=='skip').length>=2&&(ty.includes('name')||ty.includes('addr'))){hi=i;break}
  }
  const hdr=hi>=0?rows[hi].map(c=>cleanV(c.t)):[];
  map={};
  if(hi>=0){
    hdr.forEach((hd,i)=>{const f=colType(hd);if(!f||f==='skip')return;(map[f]=map[f]||[]).push(i)});
    if(!map.name)map.name=[0];
  }else if(Math.max(0,...rows.slice(0,20).map(r=>r.length))>=7){
    map={name:[0],gate:[1],code:[2],spare:[3],help:[4],guest:[5],addr:[6],keySpot:[7],wifi:[8],pass:[9],vacuum:[10]}; // Lakás infók sorrend
  }else map={name:[0],addr:[1],code:[2],help:[3]};
  const nameCol=map.name[0];
  const val=(r,f)=>{const cols=map[f]||[];return cols.map(c=>{const v=cleanV(r[c]&&r[c].t);if(!v)return'';return(cols.length>1&&hdr[c]&&f!=='addr')?`${hdr[c]}: ${v}`:v}).filter(Boolean).join(f==='addr'?', ':'\n')};
  let n=0,changed=0,sect='',prevEmpty=true;const groups={};
  for(const r of rows.slice(hi+1)){
    const empty=!r.some(c=>cleanV(c.t)||c.l);
    if(empty){sect='';prevEmpty=true;continue}
    const name=cleanV(r[nameCol]&&r[nameCol].t),k=norm(name);
    const nv={};
    for(const f of['addr','gate','code','spare','keySpot','door','guest','wifi','pass','wifi2','vacuum','help','extra'])if(map[f])nv[f]=val(r,f);
    let link='';
    if(map.help)for(const c of map.help){const l=r[c]&&r[c].l;if(l&&/^https?:\/\//i.test(l)){link=l;break}}
    if(!link&&opt.hasLinks)for(const c of r)if(c.l&&/^https?:\/\/docs\.google/i.test(c.l)){link=c.l;break}
    const core=nv.addr||nv.gate||nv.code||nv.spare||nv.keySpot||link;
    if(!k){prevEmpty=false;continue}
    if(!core&&prevEmpty){sect=name;prevEmpty=false;continue}  // szekció-cím (pl. „Bajcsy szobakódok”)
    prevEmpty=false;
    if(seen.has(k))continue; // a régi lap nem írja felül az aktuálisat
    seen.add(k);
    const aliases=[];const ha=helpAlias(nv.help);if(ha&&ha!==k)aliases.push(ha);
    if(nv.help!==undefined&&(helpAlias(nv.help)||/^link$/i.test(nv.help)))nv.help='';
    if(nv.extra){nv.help=[nv.help,nv.extra].filter(Boolean).join('\n')}delete nv.extra;
    nv.address=nv.addr;delete nv.addr;if(nv.address===undefined)delete nv.address;
    if(opt.hasLinks&&map.help)nv.helpUrl=link;
    const old=apts[k];
    const upd={...(old||{note:''}),name,sect,old:!!opt.old,aliases};
    upd.manual={...((old&&old.manual)||{})};upd.mine={...((old&&old.mine)||{})};
    const prev={};
    for(const[f,v]of Object.entries(nv)){
      if(v===undefined)continue;
      if(upd.mine[f]){if(v===upd.mine[f].from)continue;delete upd.mine[f]} // a táblázatban még a régi kód van → a tiéd marad
      if(!v&&upd.manual[f])continue;          // kézzel beírt adatot üres cella nem töröl
      if(v)delete upd.manual[f];
      if(old&&CODE_FIELDS.includes(f)&&old[f]&&v&&old[f]!==v)prev[f]=old[f];
      upd[f]=v;
    }
    if(Object.keys(prev).length){upd.prev=prev;upd.codeChanged=Date.now();upd.prevCode=prev.code||'';changed++}
    if(old&&old.address!==upd.address){delete upd.lat;delete upd.lon;delete upd.geoAddr;delete upd.geoManual;delete upd.geoOk}
    apts[k]=upd;n++;
    if(name.includes(',')){const pre=name.split(',')[0].trim();if(pre.length>=3)(groups[pre]=groups[pre]||[]).push({room:name.split(',').slice(1).join(',').trim(),gate:upd.gate,code:upd.code})}
  }
  // „VÁCI 57, Room 202…” sorokból közös lakás: „VÁCI 57” (a Viberben így jön: VÁCI-57) – a szobák kódjaival
  for(const[pre,rs]of Object.entries(groups)){
    if(rs.length<2)continue;const gk=norm(pre);if(seen.has(gk))continue;
    const old=apts[gk]||{note:'',manual:{}};
    apts[gk]={...old,name:pre,group:true,aliases:old.aliases||[],help:'Szobák kódjai:\n'+rs.map(r=>`${r.room}: ${[r.gate,r.code].filter(Boolean).join(' / ')||'–'}`).join('\n'),address:old.address||''};
  }
  return{n,changed};
}
function parseCSV(t,force){
  t=t.replace(/^﻿/,'');
  const first=t.split(/\r?\n/)[0]||'';
  const d=force||[';','\t',','].map(c=>[c,first.split(c).length-1]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function sheetRows(ws){
  const out=[];if(!ws||!ws['!ref'])return out;
  const R=XLSX.utils.decode_range(ws['!ref']);
  for(let r=R.s.r;r<=R.e.r;r++){
    const row=[];
    for(let c=R.s.c;c<=R.e.c;c++){
      const cell=ws[XLSX.utils.encode_cell({r,c})];
      row.push(cell?{t:cell.w!=null?String(cell.w):(cell.v!=null?String(cell.v):''),l:(cell.l&&cell.l.Target)||''}:{t:'',l:''});
    }
    out.push(row);
  }
  return out;
}
function importBuffer(buf){
  const u=new Uint8Array(buf);
  const bin=(u[0]===0x50&&u[1]===0x4B)||(u[0]===0xD0&&u[1]===0xCF);
  let sets,hasLinks=false;
  if(bin){
    if(typeof XLSX==='undefined')throw new Error('Az Excel-olvasó nem töltődött be (nincs net?)');
    const wb=XLSX.read(u,{type:'array'});hasLinks=true;
    sets=wb.SheetNames.map(nm=>({rows:sheetRows(wb.Sheets[nm]),old:/r[eé]gi|archiv|old/i.test(nm)}));
    sets.sort((a,b)=>a.old-b.old);
  }else{
    let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){txt=new TextDecoder('windows-1250').decode(u)}
    if(/^\s*<(!doctype|html)/i.test(txt))throw new Error('a link nem táblázatot adott vissza – ellenőrizd a megosztást');
    sets=[{rows:parseCSV(txt),old:false}];
  }
  const r={n:0,changed:0},seen=new Set();
  for(const s of sets){const x=importRows(s.rows,{old:s.old,hasLinks,seen});r.n+=x.n;r.changed+=x.changed}
  if(!r.n)throw new Error('nem találtam lakás-sorokat a táblázatban');
  r.links=hasLinks;
  LS.set('dataAt',Date.now());
  return r;
}
function importText(txt){
  txt=String(txt||'');
  if(!txt.trim())throw new Error('üres a beillesztett szöveg');
  const rows=parseCSV(txt,txt.includes('\t')?'\t':null);
  const r=importRows(rows,{old:false,hasLinks:false,seen:new Set()});
  if(!r.n)throw new Error('nem találtam lakás-sorokat – a fejléc-sort (Lakás, Kapukód…) is másold ki');
  LS.set('dataAt',Date.now());
  return r;
}

function gsUrls(u){

/* ⛽ Autó: km-óra + a kijelző kWh és benzin (L) számlálója 4 ponton:
   🏠 indulás otthonról → ▶ munka indítása (mosoda) → ⏹ munka vége (mosoda) → 🏠 hazaérés.
   A számlálókat nem kell nullázni: a különbségekből számol. Munka = indítás→vége, ingázás = a két otthoni szakasz. */
const METER_PTS={home0:'🏠 Indulás otthonról',start:'▶ Munka indítása (mosoda)',end:'⏹ Munka vége (mosoda)',home1:'🏠 Hazaérkezés'};
const numIn=v=>{v=String(v??'').replace(/\s/g,'').replace(',','.');if(v==='')return null;const n=+v;return isFinite(n)?n:null};
const fmtN=(x,d)=>x==null?'–':(+x).toFixed(d).replace('.',',');
const fmtFt=x=>Math.round(x).toLocaleString('hu-HU')+' Ft';
function dayByDate(dt){return today&&today.date===dt?today:days.find(d=>d.date===dt)||null}
const meterResets=()=>cfg.meterReset!=='0'; // Ampera: teljes töltéskor a kWh/L számláló nullázódik
function fuelSeg(a,b){
  if(!a||!b)return null;const r={};let any=false;
  for(const f of['km','kwh','l'])if(a[f]!=null&&b[f]!=null){let v=+(b[f]-a[f]).toFixed(3);
    if(v<0&&f!=='km'&&meterResets()){v=b[f];r.reset=true} // közben feltöltötted → nulláról indult újra
    if(v>=0){r[f]=v;any=true}else r.reset=true;
    if(a['~'+f]||b['~'+f])r.est=true}
  return any||r.reset?r:null;
}
// hiányzó kWh/L kiegészítése: reggel 0 (éjjel feltöltve), köztes pontokon a km arányában (becsült)
function meterFilled(m){
  const keys=['home0','start','end','home1'],R=keys.map(k=>m[k]?{...m[k]}:null);
  if(meterResets()){const i=R.findIndex(Boolean);if(i>=0&&keys[i]==='home0'||i>=0&&keys[i]==='start'&&!m.home0)for(const f of['kwh','l'])if(R[i][f]==null&&R.some((x,j)=>j>i&&x&&x[f]!=null)){R[i][f]=0;R[i]['~0'+f]=1}}
  for(const f of['kwh','l'])R.forEach((x,i)=>{if(!x||x[f]!=null||x.km==null)return;
    let j=i-1;while(j>=0&&!(R[j]&&R[j][f]!=null&&R[j].km!=null))j--;let k=i+1;while(k<R.length&&!(R[k]&&R[k][f]!=null&&R[k].km!=null))k++;
    if(j<0||k>=R.length)return;const a=R[j],b=R[k];if(b[f]<a[f]||b.km<=a.km)return;
    // benzin: az Ampera előbb az akkut használja el → a benzin a későbbi szakaszra esik; áram: km arányában
    x[f]=f==='l'&&meterResets()?a[f]:+(a[f]+(b[f]-a[f])*(x.km-a.km)/(b.km-a.km)).toFixed(3);x['~'+f]=1});
  const o={};keys.forEach((k,i)=>{if(R[i])o[k]=R[i]});return o;
}
function addSeg(x,y){if(!x)return y;if(!y)return x;const r={};for(const f of['km','kwh','l'])if(x[f]!=null||y[f]!=null)r[f]=(x[f]||0)+(y[f]||0);r.reset=x.reset||y.reset;r.est=x.est||y.est;r.partial=!(x&&y);return r}
function segCost(r,p){if(!r)return null;p=p||{};let c=0,ok=false;
  if(r.kwh!=null&&p.kwh){c+=r.kwh*(1+(+p.loss||0)/100)*p.kwh;ok=true}
  if(r.l!=null&&p.l){c+=r.l*p.l;ok=true}
  return ok?c:null}
const curPrices=()=>({kwh:numIn(cfg.elecPrice),l:numIn(cfg.fuelPrice),loss:numIn(cfg.chargeLoss)??10});
function dayFuel(d){
  if(!d||!d.meter)return null;const m=meterFilled(d.meter);
  const p=d.prices||curPrices();
  const work=fuelSeg(m.start,m.end);
  const c1=fuelSeg(m.home0,m.start),c2=fuelSeg(m.end,m.home1);
  const comm=c1||c2?addSeg(c1,c2):null;if(comm&&(!c1||!c2))comm.partial=true;
  return{work,comm,p,wc:segCost(work,p),cc:segCost(comm,p)};
}
function segTxt(r,c){
  if(!r)return'nincs leolvasás';
  return`${r.km!=null?fmtN(r.km,0)+' km':''}${r.kwh!=null?' · '+fmtN(r.kwh,1)+' kWh':''}${r.l!=null?' · '+fmtN(r.l,2)+' L':''}${c!=null?' · <b>'+fmtFt(c)+'</b>':''}${r.km&&c!=null?' <span class="mut">('+fmtN(c/r.km,1)+' Ft/km)</span>':''}${r.est?' <span class="mut">(részben becsült)</span>':''}${r.reset?' <span class="warn">⚠ egy számláló közben nullázódott</span>':''}${r.partial?' <span class="mut">(csak az egyik út)</span>':''}`;
}
function fuelLines(d){
  const F=dayFuel(d);if(!F||(!F.work&&!F.comm))return'';
  return`<div class="fuel">⛽ <b>Munka:</b> ${segTxt(F.work,F.wc)}<br>🏠 <b>Ingázás:</b> ${segTxt(F.comm,F.cc)}${F.wc!=null||F.cc!=null?`<br>Összesen: <b>${fmtFt((F.wc||0)+(F.cc||0))}</b>`:''}${!F.p.kwh||!F.p.l?' <span class="warn">– add meg az áram- és benzinárat a Beállításokban</span>':''}</div>`;
}

function loadList(atId){
  const pend=today.stops.filter(s=>s.status!=='done');
  let i=0;if(atId){i=pend.findIndex(s=>s.id===atId);if(i<0)i=0}
  const at=pend[i];
  if(at&&at.type==='depot'&&at.pickupFor){const x=pend.find(s=>s.id===at.pickupFor);return{items:x?[x]:[],pickup:true}}
  if(at&&at.type==='depot')i++;
  const items=[];
  for(;i<pend.length;i++){const s=pend[i];if(s.type==='depot'){if(s.pickupFor)continue;break}if(!s.viaDepot)items.push(s)}
  return{items,pickup:false};
}

function openViberLink(text){
  const enc=encodeURIComponent(text);
  location.href=/Android/i.test(navigator.userAgent)?`intent://forward?text=${enc}#Intent;scheme=viber;package=com.viber.voip;end`:`viber://forward?text=${enc}`;
}
function openMsgLink(text){
  if(cfg.viberMode==='wa'){location.href='https://wa.me/?text='+encodeURIComponent(text);return}
  openViberLink(text);
}
function sendViber(text,file){
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(()=>{})}catch(e){}
  if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({text,files:[file]}).catch(e=>{if(!e||e.name!=='AbortError')openMsgLink(text)});
    return;
  }
  if(file)toast('📷 A fotót ez a mód nem tudja csatolni – a szöveg a vágólapon is van');
  if((cfg.viberMode||'share')==='share'&&navigator.share){
    navigator.share({text}).catch(e=>{if(!e||e.name!=='AbortError')openMsgLink(text)});
    return;
  }
  openMsgLink(text);
}

let mapObj=null,leafP=null;const geomCache=new Map();
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafP)return leafP;
  leafP=new Promise((res,rej)=>{
    const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';s.onload=()=>res();s.onerror=()=>{leafP=null;rej(new Error('a térkép nem töltődött be (nincs net?)'))};document.head.appendChild(s);
  });
  return leafP;

function stopPos(s){
  if(s.type==='depot')return cfg.depotLat?(parkOf(cfg.depotAddr)||{lat:cfg.depotLat,lon:cfg.depotLon}):null;
  if(s.status==='done'&&s.pos)return s.pos;
  const a=getApt(s);return a&&a.lat?(parkOf(a.address)||{lat:a.lat,lon:a.lon}):null;
}
// a megállók térképi sorrendje: kész (időrendben), majd a hátralévők a lista sorrendjében
function mapSeq(){
  if(!today)return{done:[],pend:[],miss:[]};
  const done=today.stops.filter(s=>s.status==='done').sort((a,b)=>a.doneAt-b.doneAt);
  const pend=today.stops.filter(s=>s.status!=='done');
  const miss=[...done,...pend].filter(s=>s.type!=='depot'&&!stopPos(s));
  return{done,pend,miss};
}
async function routeGeom(pts){
  if(pts.length<2)return null;
  const key=pts.map(p=>p.lat.toFixed(5)+','+p.lon.toFixed(5)+(p.curb?'c':'')).join(';');
  if(geomCache.has(key))return geomCache.get(key);
  let g=null;
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.lon+','+p.lat).join(';')}?overview=full&geometries=geojson${apr(pts)}`);
    const j=await r.json();
    if(j.code==='Ok'&&j.routes&&j.routes[0])g=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);
  }catch(e){}
  if(!g)g=pts.map(p=>[p.lat,p.lon]); // tartalék: egyenes vonalak
  geomCache.set(key,g);return g;
}

async function initMap(){
  try{await loadLeaflet()}catch(e){const m=$('#map');if(m)m.innerHTML=`<div class="pad">${esc(e.message)}</div>`;return}

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const{done,pend}=mapSeq(),all=ui.mapAll!==false,D=cfg.depotLat?(parkOf(cfg.depotAddr)||{lat:cfg.depotLat,lon:cfg.depotLon}):null;
  const icon=(cls,txt)=>L.divIcon({className:'',html:`<div class="pin ${cls}">${txt}</div>`,iconSize:null,iconAnchor:[cls.includes('next')?18:14,cls.includes('next')?18:14],popupAnchor:[0,-14]});

    add(s,String(n),(first?'next ':'')+(s.urgent?'urg ':'')+(a&&a.geoOk&&!a.geoPrecise&&!a.geoManual?'warn':''));first=false}
  for(const{p,items}of groups.values()){

    const cls=(pendI.length?pendI[0].cls:'done')+(lab.length>2?' wide':'');

    L.marker([p.lat,p.lon],{icon:icon(cls,esc(lab)),zIndexOffset:cls.includes('next')?1000:cls.includes('done')?-500:0}).addTo(map).bindPopup(html);
    bounds.push([p.lat,p.lon]);
  }
  if(D){L.marker([D.lat,D.lon],{icon:icon('dep','🏭'),zIndexOffset:500}).addTo(map).bindPopup(`<b>🏭 Mosoda / raktár</b><br>${esc(cfg.depotAddr)}`);bounds.push([D.lat,D.lon])}
  // útvonal: kész rész szürkén, hátralévő kéken
  const dp=[...(D?[D]:[]),...done.map(stopPos).filter(Boolean)];

      pv.textContent=doneMessage(s,{...ui.mx,todosDone:T.filter(x=>chk[x.t.id]).map(x=>x.t.text),todosLeft:T.filter(x=>!chk[x.t.id]).map(x=>x.t.text)})}}
});
async function handleShare(){
  const q=new URLSearchParams(location.search);
  if(!q.has('shared'))return;
  history.replaceState(null,'',location.pathname);
  let text='',file=null;
  try{
    const c=await caches.open('futar-share');
    const t=await c.match('share-text');if(t)text=await t.text();
    const f=await c.match('share-file');if(f)file=await f.arrayBuffer();
    await c.delete('share-text');await c.delete('share-file');
  }catch(e){}
  if(!text&&(q.get('text')||q.get('title')))text=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join('\n');
  if(file&&file.byteLength){try{afterImport(importBuffer(file),'Megosztott táblázat')}catch(e){toast('Nem sikerült: '+e.message)}return}
  if(text)processSharedText(text);
}
const SUFX=['','BA','BE','BAN','BEN','RA','RE','NAK','NEK','HOZ','HEZ','BOL','ROL','TOL','NAL','NEL','T','ON','EN','N','I','OS','ES'];
function looksLikeList(text){
  if(/^\s*\d{4}\.\s?\d{2}\.\s?\d{2}/m.test(text))return true;
  const{names}=parseMsg(text);
  if(!names.length)return false;
  if(names.every(n=>n.length<=24&&n.split(/\s+/).length<=3))return true; // csupa rövid név → napi lista
  const hit=names.filter(n=>n.length<=24&&n.split(/\s+/).length<=3&&findApt(n)).length;
  return hit/names.length>=0.5;
}
// lakásnév keresése egy szabad szövegben: „Tok 1 …” → TÖK-1, „Bokrétába …” → BOK
function detectApt(text){
  const w=String(text).replace(/[^\p{L}\p{N}\s-]/gu,' ').split(/\s+/).filter(Boolean);
  const E=Object.entries(apts).flatMap(([k,a])=>[k,...(a.aliases||[])].map(x=>({x,k,a})));
  let best=null;
  for(let i=0;i<w.length;i++){
    const cands=[];if(w[i+1]&&/^\d+$/.test(w[i+1]))cands.push(norm(w[i]+w[i+1]));if(w[i+1]&&/^\d+-\d+$/.test(w[i+1]))cands.push(norm(w[i]+w[i+1]));cands.push(norm(w[i]));
    for(const c of cands){if(c.length<3)continue;
      for(const e of E){if(e.x.length<3)continue;
        let sc=0;if(c===e.x)sc=100+e.x.length;else if(c.startsWith(e.x)&&SUFX.includes(c.slice(e.x.length))&&!/\d$/.test(e.x))sc=50+e.x.length;
        if(sc&&e.a.old)sc-=20;
        if(sc&&(!best||sc>best.sc))best={sc,a:e.a};
      }}
  }
  return best&&best.a;
}
function processSharedText(text){
  if(!looksLikeList(text)&&!(text.includes('\t')&&text.split('\n').length>3)){
    const a=detectApt(text);
    ui.modal={kind:'todo',apt:a?a.name:'',text:text.trim()};ui.tab='today';render();return;
  }
  if(text.includes('\t')&&text.split('\n').length>3){try{afterImport(importText(text),'Megosztott táblázat')}catch(e){toast('Nem sikerült: '+e.message)}return}
  const{date,names,urgent,info}=parseMsg(text);
  ui.tab='today';
  if(!names.length){toast('A megosztott szövegben nem találtam lakásneveket');return}
  if(!today){loadDay(names,date,false,urgent,info);return}
  if(!date||date===today.date){
    if(confirm(`${names.length} lakás érkezett. Hozzáadjam a mai listához?`)){loadDay(names,date,true,urgent,info);return}
  }else if(confirm(`Új napi lista érkezett (${date}). A(z) ${today.date} napot lezárjam, és az újat kezdjem?`)){
    if(today.stops.some(s=>s.status==='done')){today.endedAt=today.endedAt||Date.now();days.unshift(today)}
    today=null;save();loadDay(names,date,false,urgent,info);return;
  }
  ui.paste=text;render();toast('Az üzenet a beillesztő mezőbe került');
}
migrate();
render();
handleShare();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.onLine){
  checkUpdate(true);
  if(cfg.dataUrl)syncData(false);
  if(today){replan();fillLegs()}
}
