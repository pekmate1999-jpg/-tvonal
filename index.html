<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="app-version" content="1.11.1">
<title>Ágynemű futár</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--hd:#3a9d23;--nav:#e3f4bd;--navtx:#2b5d12}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--card:#161d33;--tx:#e5e7eb;--mut:#9ca3af;--bd:#26304d;--ac:#3b82f6;--hd:#2d7a1a;--nav:#d9efa8;--navtx:#27510f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.pad{padding:12px}
.head{display:flex;gap:10px;align-items:center;padding:6px 12px 10px;cursor:pointer}
.done .nm{text-decoration:line-through;opacity:.6}
.done .plan b{color:var(--ok)}
.grow{flex:1;min-width:0}.small{font-size:13px}.mut{color:var(--mut)}
.body{padding:0 12px 12px;border-top:1px solid var(--bd)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:10px 0 2px}
.code{font:700 28px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.06em;word-break:break-all}
.pre{white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn,button{appearance:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
.bad{color:var(--bad)}
.on{outline:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--card))}
.dis{opacity:.4;pointer-events:none}
.flex1{flex:1}
input,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin-top:4px}
textarea{min-height:76px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;flex-direction:column;gap:0;font-size:12px;padding:10px 4px}
nav button.on{outline:0;color:var(--ac);background:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum div{padding:12px 4px}.sum b{display:block;font-size:22px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;background:#111827;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;max-width:616px;margin:0 auto;text-align:center}
h2{font-size:18px;margin:6px 2px 10px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd)}
.top{background:var(--hd);color:#fff;padding:12px 14px;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .ttl{font-size:22px;font-weight:800}.top .sub{font-size:12px;opacity:.9}
.pill{background:rgba(0,0,0,.25);border-radius:14px;padding:4px 10px;text-align:center;font-weight:700;font-size:13px;line-height:1.2;flex:none}
.pill span{display:block;font-weight:500;font-size:11px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px}
.tile{padding:8px 3px;text-align:center;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.tile:nth-child(4n){border-right:0}.tile:nth-last-child(-n+4){border-bottom:0}
.tile i{font-style:normal;display:flex;align-items:center;justify-content:center;min-height:28px;font-size:11px;line-height:1.15;color:var(--mut)}
.tile b{font-size:17px}
.rnd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 4px 6px}
.plan{display:flex;justify-content:space-between;gap:8px;padding:10px 12px 0;font-size:13px;color:var(--mut)}
.plan b{color:var(--tx)}
.navbtn{background:var(--nav);color:var(--navtx);border-color:var(--nav);border-radius:99px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:1}
.acts{padding:0 12px 12px}
.depot{border-left:5px solid var(--hd)}
.warn{color:var(--warn)}
.bdg{display:inline-block;font-size:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));color:var(--warn);border-radius:8px;padding:1px 7px;font-weight:700}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.log{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.5}
.late{color:var(--bad);font-weight:700}.early{color:var(--ok);font-weight:700}
.cl{font:600 13px/1.45 ui-monospace,Menlo,monospace;margin-top:4px}
.code.m{font-size:20px}.mono{font-family:ui-monospace,Menlo,monospace}
.old{font-size:11px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:0 5px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.modal{background:var(--card);color:var(--tx);border-radius:18px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal .mt{font-size:21px;font-weight:800}.modal button{padding:16px;font-size:17px}
.warnb{background:var(--warn);color:#fff;border-color:var(--warn)}
.keyban{border:2px solid var(--bad)!important;background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.same{font-size:12px;background:color-mix(in srgb,var(--hd) 15%,var(--card));color:var(--tx);border-radius:8px;padding:1px 7px;font-weight:700}
.urg{border:2px solid var(--bad)!important}
.ubdg{font-size:12px;background:var(--bad);color:#fff;border-radius:8px;padding:1px 7px;font-weight:800}
.ibdg{font-size:12px;background:color-mix(in srgb,var(--warn) 20%,var(--card));color:var(--warn);border-radius:8px;padding:1px 7px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:8px 10px;font-size:14px;font-weight:600}
.dl{font-size:13px;padding:8px 12px;border-radius:12px;margin:0 0 10px;background:var(--card);border:1px solid var(--bd)}
.dl.bad{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.issue{border-left:4px solid var(--warn);padding:6px 8px;margin-top:8px;background:color-mix(in srgb,var(--warn) 8%,var(--card));border-radius:6px}
.mon{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px}.mon b{font-size:16px}
.todo{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--bd)}
.todo button{padding:6px 10px}.todo .tx{flex:1;min-width:0;padding-top:4px}
.tbdg{font-size:12px;background:color-mix(in srgb,var(--ac) 18%,var(--card));color:var(--ac);border-radius:8px;padding:1px 7px;font-weight:800}
.pack{border:2px solid var(--ac)}
.fuel{font-size:13px;line-height:1.6}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.mgrid input{margin:0;font-size:18px;text-align:right}.mgrid .lbl{margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav>
  <button data-act="tab" data-tab="today">📋<span>Ma</span></button>
  <button data-act="tab" data-tab="apts">🏠<span>Lakások</span></button>
  <button data-act="tab" data-tab="hist">📊<span>Előzmények</span></button>
  <button data-act="tab" data-tab="set">⚙️<span>Beállítás</span></button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ===== állapot ===== */
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
let apts=LS.get('apts',{}), today=LS.get('today',null), days=LS.get('days',[]), keysHeld=LS.get('keysHeld',[]);
const DEF={template:'{név} Kész',city:'Budapest',depotAddr:'Bajcsy-Zsilinszky út 35, Budapest',cap:0,stopMin:8,stripMin:12,reloadMin:15,dataUrl:'',deadline:'15:00'};
let cfg=Object.assign({},DEF,LS.get('cfg',{}));
if(!cfg.alias||typeof cfg.alias!=='object')cfg.alias={};
if(!cfg.mergeAddr||typeof cfg.mergeAddr!=='object')cfg.mergeAddr={};
let ui={tab:'today',open:null,edit:null,aptOpen:null,histOpen:null,q:'',paste:'',newVer:null};
let matchCache=new Map();
const save=()=>{matchCache.clear();LS.set('keysHeld',keysHeld);LS.set('apts',apts);LS.set('today',today);LS.set('days',days);LS.set('cfg',cfg)};
const APP_VERSION=(document.querySelector('meta[name=app-version]')||{}).content||'?';
const SCHEMA=3; // növeld, ha az adatformátum megváltozik, és írj hozzá átalakítót a migrate()-be
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const pad2=n=>String(n).padStart(2,'0');
const fmtT=ms=>new Date(ms).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
const fmtDur=ms=>{const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return h?`${h} ó ${m%60} p`:`${m} p`};
const hm=ms=>{const m=Math.max(0,Math.round(ms/60000));return pad2(Math.floor(m/60))+':'+pad2(m%60)};
const fmtKm=k=>k.toFixed(1).replace('.',',')+' km';
const ld=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let toastT;
function toast(m,sticky){const t=$('#toast');clearTimeout(toastT);if(!m){t.style.display='none';return}t.textContent=m;t.style.display='block';if(!sticky)toastT=setTimeout(()=>t.style.display='none',4500)}
function safeRender(){const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))return;render()}

/* ===== raktár-tételek, adatmigráció ===== */
function mkDepot(kind){return{id:uid(),type:'depot',kind,name:kind==='end'?'Vissza a mosodába':'Újratöltés',status:'pending',cleaner:null}}
function ensureEnd(){
  if(!today)return;
  const ends=today.stops.filter(s=>s.type==='depot'&&s.kind==='end');
  const pendingEnd=ends.some(s=>s.status!=='done');
  const pendingOther=today.stops.some(s=>s.status!=='done'&&!(s.type==='depot'&&s.kind==='end'));
  if(!pendingEnd&&(!ends.length||pendingOther))today.stops.push(mkDepot('end'));
}
function migrate(){
  const from=LS.get('schema',0);
  if(from>=SCHEMA)return;
  try{localStorage.setItem('backup_before_schema_'+SCHEMA,JSON.stringify({apts,today,days,cfg,at:Date.now()}))}catch(e){}
  if(from<2)ensureEnd();
  if(from<3){for(const t of [...days,...(today?[today]:[])])for(const s of t.stops)if(s.type!=='depot'&&!s.cleaner)s.cleaner='done'} // v1.10: a takarító alapból végzett // v1.2: a mai listához végállomás (raktár)
  LS.set('schema',SCHEMA);save();
}

/* ===== üzenet feldolgozása ===== */
function parseMsg(t){
  let date=null;const names=[],urgent=[];
  for(let line of String(t||'').split(/\r?\n/)){
    line=line.trim();if(!line||line.startsWith('@'))continue;
    const m=line.match(/^(\d{4})\.\s?(\d{2})\.\s?(\d{2})/);
    if(m){date=`${m[1]}-${m[2]}-${m[3]}`;continue}
    const u=/!|⚡|❗|‼|s[üu]rg[őo]s/i.test(line);
    const n=line.replace(/s[üu]rg[őo]s/ig,'').replace(/[^\p{L}\p{N}\s.\-]/gu,'').replace(/\s+/g,' ').trim();
    if(n){names.push(n);if(u)urgent.push(n)}
  }
  return{date,names,urgent};
}
/* Viber-név → táblázat-név: pontos, kézi összerendelés, segédlet-név (pl. „Holló bejutási infók”),
   majd betű-előtag + azonos sorszám (DOHÁNY-2 → DOH-2, KÁROLY-1 → KAR-1, NYÁRY → NYA) */
const splitKey=k=>{const m=String(k).match(/^([A-Z]+?)(\d*)$/);return m?{L:m[1],D:m[2]}:null};
function pickKey(c){const act=c.filter(([,a])=>!a.old),l=act.length?act:c;return l.length===1?l[0][0]:null}
function fuzzyKey(k){
  const E=Object.entries(apts);
  let c=E.filter(([,a])=>(a.aliases||[]).includes(k));
  if(c.length){const r=pickKey(c);if(r)return r}
  const s=splitKey(k);
  if(s&&s.L.length>=3){
    c=E.filter(([key,a])=>[key,...(a.aliases||[])].some(x=>{const t=splitKey(x);return t&&t.D===s.D&&t.L.length>=3&&(t.L.startsWith(s.L)||s.L.startsWith(t.L))}));
    if(c.length){const r=pickKey(c);if(r)return r}
  }
  c=E.filter(([key])=>key.startsWith(k));
  return c.length?pickKey(c):null;
}
function findApt(name){
  const k=norm(name);if(!k)return null;
  const al=cfg.alias[k];if(al&&apts[al])return apts[al];
  if(apts[k])return apts[k];
  if(!matchCache.has(k))matchCache.set(k,fuzzyKey(k));
  const r=matchCache.get(k);return r?apts[r]:null;
}
const getApt=s=>s.type==='depot'?null:findApt(s.members?s.members[0]:s.name);
function aptKey(s){const a=getApt(s);return a?norm(a.name):norm(s.name)}

/* ===== geokódolás, távolságok, útvonal ===== */
let lastGeo=0;const geoFail=new Map();
/* Címtisztítás: „1074 Budapest, Jósika u. 5. 1. emelet 8” → „1074 Budapest, Jósika utca 5” (+ kerület az irányítószámból) */
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII'];
const STREET='utca|útja|út|körút|tér|tere|köz|sor|rakpart|sétány|fasor|sugárút|park|lépcső|liget|dűlő|udvar|lakótelep|telep|átjáró|part';
function parseAddr(addr){
  const s=String(addr||'').replace(/\s+/g,' ').trim();
  const pcm=s.match(/(?:^|[\s,])(1\d{3})(?=[\s,.]|$)/);
  const pc=pcm&&+pcm[1].slice(1,3)>=1&&+pcm[1].slice(1,3)<=23?pcm[1]:'';
  let t=s;if(pc)t=t.replace(pc,' ');
  t=t.replace(/\bBudapest\b/i,' ').replace(/^[\s,.]+/,'').replace(/\s+/g,' ');
  t=t.replace(/\bu\.(?=[\s,\d]|$)/gi,'utca ').replace(/\bkrt\.?(?=[\s,\d]|$)/gi,'körút ').replace(/\bút\./gi,'út ').replace(/\btér\./gi,'tér ').replace(/\s+/g,' ').trim();
  const re=new RegExp('^(.*?\\b(?:'+STREET+'))\\.?\\s*(\\d+(?:\\s*[-–]\\s*\\d+)?(?:\\s?\\/\\s?[A-Za-z]\\b|[A-Za-z]\\b)?)','i');
  let m=t.match(re),street='',num='';
  if(m){street=m[1].replace(/[,.\s]+$/,'').trim();num=m[2].replace(/\s+/g,'')}
  else{const m2=t.match(/^([^\d,]+?)[\s,.]*(\d+(?:[-–]\d+)?(?:\/?[A-Za-z]\b)?)/);if(m2){street=m2[1].replace(/[,.\s]+$/,'').trim();num=m2[2]}else street=t.split(',')[0].trim()}
  street=street.charAt(0).toUpperCase()+street.slice(1);
  const district=pc?String(+pc.slice(1,3)):'';
  const town=(pc||/budapest/i.test(s))?'Budapest':(cfg.city||'');
  const clean=[street,num].filter(Boolean).join(' ');
  return{pc,district,roman:district?ROMAN[+district]:'',street,num,town,full:(pc?pc+' ':'')+(town?town+', ':'')+clean};
}
const GEO_V=3; // 3: csak házszámra pontos találat számít pontosnak
function geoMatches(res,p){
  const ad=res.address||{},txt=[ad.city,ad.town,ad.city_district,ad.district,ad.suburb,ad.borough,res.display_name].join(' ');
  if(p.town==='Budapest'&&!/budapest/i.test(txt))return false;
  if(!p.district)return true;
  const pc=String(ad.postcode||'').replace(/\D/g,'');
  if(/^1\d{3}$/.test(pc))return String(+pc.slice(1,3))===p.district;   // kerület = irányítószám 2-3. jegye
  return new RegExp('(^|[\\s,(])'+p.roman+'\\.\\s*kerület','i').test(txt);
}
const isHouse=r=>!!((r.address&&r.address.house_number)||/^(building|house)$/.test(r.addresstype||'')||r.type==='house');
// házszám-változatok: „31-33a” → 31, 33, 33a, 33/a · „59/A” → 59/A, 59, 59A
function numVariants(num){
  const out=[],add=x=>{x=String(x||'').trim();if(x&&!out.includes(x))out.push(x)};
  const s=String(num||'').replace(/\s+/g,'');
  const nums=s.match(/\d+/g)||[];const let_=(s.match(/[A-Za-z]$/)||[''])[0];
  if(!nums.length)return out;
  if(/[-–]/.test(s)){add(nums[0]);add(nums[1]);if(let_){add(nums[1]+let_.toLowerCase());add(nums[1]+'/'+let_.toLowerCase())}}
  else{add(s);if(let_){add(nums[0]+'/'+let_.toUpperCase());add(nums[0]+let_.toLowerCase())}add(nums[0])}
  return out;
}
async function nomi(params){
  const w=Math.max(0,1100-(Date.now()-lastGeo));if(w)await sleep(w);lastGeo=Date.now();
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=hu&accept-language=hu&'+new URLSearchParams(params));
  return await r.json();
}
async function geocode(a){
  if(!a||!a.address)return false;
  if(a.lat&&a.geoAddr===a.address&&(a.geoManual||a.geoV===GEO_V))return true;
  if(Date.now()-(geoFail.get(a.address)||0)<6e5)return false;
  const p=parseAddr(a.address),V=numVariants(p.num);
  const pcP=p.pc?{postalcode:p.pc}:{};
  let street=null;
  const take=(r,precise)=>{a.lat=+r.lat;a.lon=+r.lon;a.geoAddr=a.address;a.geoV=GEO_V;a.geoOk=true;a.geoPrecise=precise;delete a.geoManual;return true};
  const tries=[];
  if(p.street&&p.town){
    for(const v of V)tries.push({street:v+' '+p.street,city:p.town,...pcP});
    for(const v of V.slice(0,2))tries.push({q:`${p.street} ${v}, ${p.pc?p.pc+' ':''}${p.town}`});
    if(p.roman&&V[0])tries.push({q:`${p.street} ${V[0]}, ${p.town} ${p.roman}. kerület`});
  }
  tries.push({q:a.address});
  for(const t of tries){
    try{
      const res=((await nomi(t))||[]).filter(r=>geoMatches(r,p));
      const house=res.find(isHouse);
      if(house)return take(house,true);
      if(!street&&res[0])street=res[0];
    }catch(e){}
  }
  if(!street&&p.street&&p.town){try{street=((await nomi({street:p.street,city:p.town,...pcP}))||[]).find(r=>geoMatches(r,p))||null}catch(e){}}
  if(street)return take(street,false); // csak az utca ismert: útvonaltervhez jó, a Waze címre keres
  delete a.lat;delete a.lon;a.geoOk=false;a.geoPrecise=false;a.geoV=GEO_V;
  geoFail.set(a.address,Date.now());
  return false;
}
async function depotPos(){
  if(cfg.depotLat&&cfg.depotGeo===cfg.depotAddr)return{lat:cfg.depotLat,lon:cfg.depotLon};
  const t={address:cfg.depotAddr};
  if(await geocode(t)){cfg.depotLat=t.lat;cfg.depotLon=t.lon;cfg.depotGeo=cfg.depotAddr;save();return{lat:t.lat,lon:t.lon}}
  return null;
}
async function itemPos(s,D){
  if(s.type==='depot')return D;

function mbUse(kind,n){const u=LS.get('mbUse',{}),m=new Date().toISOString().slice(0,7);if(u.m!==m){u.m=m;u.el=0;u.rq=0}u[kind]=(u[kind]||0)+n;LS.set('mbUse',u)}
let trafficErr='';
async function mbGet(url){
  const r=await fetch(url+(url.includes('?')?'&':'?')+'access_token='+encodeURIComponent(cfg.mbToken));
  if(r.status===401)throw new Error('érvénytelen token');
  if(r.status===429)throw new Error('túl sok kérés / elfogyott a havi keret');
  if(!r.ok)throw new Error('HTTP '+r.status);

}
const ll6=p=>p.lon.toFixed(6)+','+p.lat.toFixed(6);
// élő forgalmi mátrix: a driving-traffic legfeljebb 10 pontot enged egy kérésben → 5×5-ös blokkok
async function mbMatrix(pts){
  const n=pts.length,B=5,d=pts.map(()=>Array(n).fill(null));
  for(let i=0;i<n;i+=B)for(let j=0;j<n;j+=B){
    const S=[],D=[];for(let k=i;k<Math.min(n,i+B);k++)S.push(k);for(let k=j;k<Math.min(n,j+B);k++)D.push(k);
    const U=[...new Set([...S,...D])];
    const js=await mbGet(`${MB}/directions-matrix/v1/mapbox/driving-traffic/${U.map(k=>ll6(pts[k])).join(';')}?sources=${S.map(k=>U.indexOf(k)).join(';')}&destinations=${D.map(k=>U.indexOf(k)).join(';')}&annotations=duration`);
    mbUse('el',S.length*D.length);
    S.forEach((si,a)=>D.forEach((dj,b)=>{d[si][dj]=si===dj?0:js.durations[a][b]}));
  }
  if(d.flat().some(x=>x==null))throw new Error('egy pont nem érhető el autóval');
  return d;
}
async function osrmMatrix(pts){
  const r=await fetch(`https://router.project-osrm.org/table/v1/driving/${pts.map(p=>p.lon+','+p.lat).join(';')}?annotations=duration`);
  const j=await r.json();
  if(j.code==='Ok'&&j.durations&&!j.durations.flat().includes(null))return j.durations;
  throw new Error('osrm');
}
async function matrix(pts){
  if(useTraffic()){try{const d=await mbMatrix(pts);trafficErr='';return{d,real:true,src:'traffic'}}catch(e){trafficErr=e.message}}
  try{return{d:await osrmMatrix(pts),real:true,src:'osrm'}}catch(e){}

}
async function legsOf(wp,opt){ // wp: legalább 2 pont → [{km,min,approx,src}]
  if(wp.length<2)return[];
  if(useTraffic()&&!(opt&&opt.noTraffic)){
    try{
      const out=[];
      for(let s=0;s<wp.length-1;s+=24){
        const part=wp.slice(s,s+25);
        const j=await mbGet(`${MB}/directions/v5/mapbox/driving-traffic/${part.map(ll6).join(';')}?overview=false`);
        mbUse('rq',1);
        const L=j.routes&&j.routes[0]&&j.routes[0].legs;
        if(!L||L.length!==part.length-1)throw new Error('hiányos útvonal');
        out.push(...L.map(l=>({km:l.distance/1000,min:l.duration/60,approx:false,src:'traffic'})));
      }
      trafficErr='';return out;
    }catch(e){trafficErr=e.message}
  }
  try{
    const c=wp.map(p=>p.lon+','+p.lat).join(';');
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${c}?overview=false`);
    const j=await r.json();
    if(j.code==='Ok'&&j.routes&&j.routes[0]&&j.routes[0].legs.length===wp.length-1)
      return j.routes[0].legs.map(l=>({km:l.distance/1000,min:l.duration/60,approx:false,src:'osrm'}));
  }catch(e){}

}
async function legKm(from,to){const L=await legsOf([from,to],{noTraffic:true});return{km:L[0].km,approx:L[0].approx}}
function solvePath(d,start,end,nodes){
  const n=nodes.length;
  if(n<2)return nodes.slice();

  const improve=o=>{
    let c=cost(o),imp=true;
    while(imp){imp=false;
      for(let i=0;i<o.length-1;i++)for(let j=i+1;j<o.length;j++){           // 2-opt
        const cand=o.slice(0,i).concat(o.slice(i,j+1).reverse(),o.slice(j+1)),cc=cost(cand);
        if(cc<c-1e-9){o=cand;c=cc;imp=true}
      }
      for(let L=1;L<=3;L++)for(let i=0;i+L<=o.length;i++){                   // Or-opt: 1-3 megálló áthelyezése
        const seg=o.slice(i,i+L),rest=o.slice(0,i).concat(o.slice(i+L));
        for(let j=0;j<=rest.length;j++){if(j===i)continue;
          const cand=rest.slice(0,j).concat(seg,rest.slice(j)),cc=cost(cand);
          if(cc<c-1e-9){o=cand;c=cc;imp=true;break}
        }
        if(imp)break;
      }
    }
    return[o,c];
  };
  const nn=first=>{
    const left=new Set(nodes),o=[];let l=start;
    if(first!=null){o.push(first);left.delete(first);l=first}
    while(left.size){let b=null,bd=Infinity;for(const x of left)if(d[l][x]<bd){bd=d[l][x];b=x}o.push(b);left.delete(b);l=b}
    return o;
  };

  for(const f of[null,...nodes]){const[o,c]=improve(nn(f));if(c<bc){bc=c;best=o}}
  return best;
}
// Garantáltan a legrövidebb idejű sorrend (dinamikus programozás, Held–Karp)
function exactPath(d,start,end,nodes){
  const n=nodes.length,F=1<<n,dp=new Float64Array(F*n).fill(Infinity),par=new Int8Array(F*n).fill(-1);
  for(let j=0;j<n;j++)dp[(1<<j)*n+j]=d[start][nodes[j]];
  for(let m=1;m<F;m++)for(let j=0;j<n;j++){
    if(!(m&(1<<j)))continue;const cur=dp[m*n+j];if(cur===Infinity)continue;
    for(let k=0;k<n;k++){if(m&(1<<k))continue;
      const nm=m|(1<<k),v=cur+d[nodes[j]][nodes[k]];
      if(v<dp[nm*n+k]){dp[nm*n+k]=v;par[nm*n+k]=j}}
  }
  let bj=0,bv=Infinity;
  for(let j=0;j<n;j++){const v=dp[(F-1)*n+j]+d[nodes[j]][end];if(v<bv){bv=v;bj=j}}
  const o=[];let m=F-1,j=bj;
  while(j>=0){o.push(nodes[j]);const p=par[m*n+j];m&=~(1<<j);j=p}
  return o.reverse();
}
// Körökre bontás: kapacitás (csomag/kör), vagy a meglévő újratöltések száma alapján
function splitRounds(list,used,cap,nRounds){
  const pk=s=>s.packs||1;
  if(cap>0){
    const out=[[]];let load=used;
    for(const s of list){
      const p=pk(s);
      if(load+p>cap&&(out[out.length-1].length||load>0)){out.push([]);load=0}
      out[out.length-1].push(s);load+=p;
    }
    return out;
  }

  for(const s of list){const p=pk(s);out[Math.min(n-1,Math.floor((c+p/2)/target))].push(s);c+=p}

}
const median=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const stopKey=s=>s.members?'G:'+addrKeyOf(s):((getApt(s)&&norm(getApt(s).name))||norm(s.name));
let modelCache=null,modelSig='';
// Tanult modell: tényleges út ≈ k × tervezett vezetés + c (+ lakásonkénti parkolási többlet); helyszíni idők lakásonként
function model(){
  const all=[...days,...(today?[today]:[])];
  const sig=all.length+':'+all.reduce((n,t)=>n+t.stops.filter(s=>s.status==='done').length,0)+':'+(cfg.parkMin??'')+':'+(cfg.stopMin)+':'+(cfg.stripMin);
  if(modelCache&&modelSig===sig)return modelCache;
  const legs={traffic:[],osrm:[]},on={},onAll={done:[],strip:[],x:[]},dep={reload:[],end:[]};
  for(const t of all)for(const s of t.stops){
    if(s.status!=='done')continue;const v=visitInfo(s);
    if(v.onsite!=null&&v.onsite<120*6e4){
      const m=v.onsite/6e4;
      if(s.type==='depot')dep[s.kind==='end'?'end':'reload'].push(m);
      else{const k=stopKey(s),c=s.cleaner==='strip'?'strip':'done';(on[k]=on[k]||{done:[],strip:[],x:[],all:[]});on[k][c].push(m);on[k].all.push(m);if(!s.members)onAll[c].push(m)}
    }
    if(s.sameBldg||v.drive==null||v.planDrive==null||v.planDrive<3e4||v.drive>90*6e4)continue;
    legs[s.legPlanSrc==='traffic'?'traffic':'osrm'].push({p:v.planDrive/6e4,a:v.drive/6e4,k:s.type==='depot'?'DEPOT':stopKey(s)});
  }
  const fit=L=>{
    if(L.length<3)return null;
    if(L.length<6){const c=median(L.map(x=>x.a-x.p));return{k:1,c:Math.max(0,Math.min(20,c)),n:L.length}}
    let best=null;
    for(let k=0.8;k<=2.501;k+=0.05){const c=Math.max(0,Math.min(20,median(L.map(x=>x.a-k*x.p))));const e=L.reduce((t,x)=>t+Math.abs(x.a-(k*x.p+c)),0);if(!best||e<best.e)best={k:+k.toFixed(2),c,e}}
    return{k:best.k,c:best.c,n:L.length,mae:best.e/L.length};
  };
  const F={traffic:fit(legs.traffic),osrm:fit(legs.osrm)};
  const manual=String(cfg.parkMin??'').trim()!=='';
  const extra={};
  for(const src of['traffic','osrm']){const f=F[src];if(!f)continue;
    const by={};for(const x of legs[src])(by[x.k]=by[x.k]||[]).push(x.a-(f.k*x.p+f.c));
    for(const[k,r]of Object.entries(by))if(r.length>=2){const e=median(r)*r.length/(r.length+2);extra[k]=Math.max(-5,Math.min(15,e))}}

  return modelCache={F,manual,extra,on,g,dep:{reload:median(dep.reload),end:median(dep.end)},nOn:onAll.done.length+onAll.strip.length+onAll.x.length},modelSig=sig,modelCache;
}
// előrejelzett út (perc) egy tervezett vezetési időből
function predDrive(plan,src,s,sameB){
  const M=model();
  if(sameB)return plan;
  if(M.manual)return plan+Math.max(0,+cfg.parkMin||0);
  // forgalmi tervhez a forgalmi modell; ha még nincs, csak a parkolási részt vesszük át (a szorzót nem, mert azt a forgalom már tartalmazza)
  const base=src==='traffic'?(M.F.traffic?M.F.traffic.k*plan+M.F.traffic.c:plan+(M.F.osrm?M.F.osrm.c:5))
                            :(M.F.osrm?M.F.osrm.k*plan+M.F.osrm.c:M.F.traffic?plan+M.F.traffic.c:plan+5);
  const k=s.type==='depot'?'DEPOT':stopKey(s);
  return Math.max(plan,base+(M.extra[k]||0));
}
// előrejelzett helyszíni idő (ms)
const svcMs=s=>{
  const M=model();
  if(s.type==='depot'){const m=M.dep[s.kind==='end'?'end':'reload'];return(m!=null&&m>0?m:(s.kind==='reload'?cfg.reloadMin:0))*6e4}
  const c=s.cleaner==='strip'?'strip':'done',L=M.on[stopKey(s)];
  let m=null;
  if(L){if(L[c].length>=2)m=median(L[c]);else if(L.all.length>=2&&c==='x')m=median(L.all)}
  if(m==null&&!s.members)m=M.g[c]!=null&&(c!=='x'||M.nOn>=3)?M.g[c]:null;
  if(m==null)m=cfg.stopMin+(c==='strip'?cfg.stripMin:0);
  if(s.members&&!(L&&L.all.length>=2))m=Math.max(m,cfg.stopMin+2*(s.members.length-1));
  return m*6e4;
};
function learnPark(){const M=model(),f=M.F.traffic||M.F.osrm;return f?{min:Math.round(f.c),n:f.n,k:f.k}:null}
function parkMin(){const v=String(cfg.parkMin??'').trim();if(v!=='')return Math.max(0,+v||0);const l=learnPark();return l?l.min:5}
async function optimize(){
  if(!today)return;
  const pending=today.stops.filter(s=>s.status!=='done'&&s.type!=='depot');
  const reloads=today.stops.filter(s=>s.status!=='done'&&s.type==='depot'&&s.kind==='reload').length;
  if(!pending.length){toast('Nincs több lakás a listán');return}
  toast('Raktár címének keresése…',1);
  const D=await depotPos();
  if(!D){toast('A raktár címét nem találom – ellenőrizd a Beállításokban');return}
  const ok=[],bad=[];let i=0;
  for(const s of pending){
    toast(`Címek keresése ${++i}/${pending.length}…`,1);
    const a=getApt(s);
    if(a&&a.address&&await geocode(a))ok.push(s);else bad.push(s);
  }
  if(!today)return;
  save();toast('Útvonal számítása…',1);
  const doneItems=today.stops.filter(s=>s.status==='done').sort((a,b)=>a.doneAt-b.doneAt);
  const lastDone=doneItems[doneItems.length-1];
  const cur=lastDone&&lastDone.type!=='depot'&&lastDone.pos?lastDone.pos:null;
  let used=0;for(let k=doneItems.length-1;k>=0&&doneItems[k].type!=='depot';k--)used+=doneItems[k].packs||1;
  let rounds=[[]];
  if(ok.length){
    const pts=[D,...(cur?[cur]:[]),...ok.map(getApt)];
    const off=cur?2:1,sIdx=cur?1:0;
    const{d,src}=await matrix(pts);today.optSrc=src;
    const nodeOf=new Map(ok.map((s,k)=>[s,k+off]));
    // sürgősek előre: start → sürgősek (szabad végponttal) → többi → raktár
    const ordered=(st,nodes)=>{
      const U=nodes.filter(x=>ok[x-off].urgent),R=nodes.filter(x=>!ok[x-off].urgent);
      if(!U.length||!R.length)return solvePath(d,st,0,nodes);
      const Z=d.length,d2=d.map(r=>[...r,0]);d2.push(Array(Z+1).fill(0));
      const u=solvePath(d2,st,Z,U);
      return[...u,...solvePath(d,u[u.length-1],0,R)];
    };
    const list=ordered(sIdx,ok.map((_,k)=>k+off)).map(x=>ok[x-off]);
    const chunks=splitRounds(list,cur?used:0,cfg.cap,reloads+1);
    rounds=chunks.map((c,k)=>ordered(k===0?sIdx:0,c.map(s=>nodeOf.get(s))).map(x=>ok[x-off]));
  }
  if(!today)return;
  const endItem=today.stops.find(s=>s.type==='depot'&&s.kind==='end'&&s.status!=='done')||mkDepot('end');
  const stops=[...doneItems];
  rounds.forEach((c,k)=>{if(k>0)stops.push(mkDepot('reload'));stops.push(...c)});
  stops.push(...bad,endItem);
  stops.forEach(s=>{if(s.status!=='done'){delete s.legPlanMin;delete s.legPlanKm;delete s.legPlanEta;delete s.svcPlanMin}});
  today.stops=stops;today.planAt=0;save();
  await replan();
  const nR=today.stops.filter(s=>s.type==='depot').length;
  const mins=today.endEta?Math.round((today.endEta-Date.now())/60000):null;
  toast(`Kész · ${nR} kör${today.remKm?` · ~${Math.round(today.remKm)} km`:''}${mins!=null?` · ~${mins} perc`:''}${today.optSrc==='traffic'?' · 🚦 élő forgalommal':useTraffic()?' · ⚠ forgalmi adat nem jött ('+trafficErr+'), forgalom nélkül':today.planApprox?' (becslés)':''}${bad.length?` · ⚠ ${bad.length} lakásnak nincs/nem található címe`:''}`);
}

/* ===== ütemezés: tervezett érkezések, hátralévő út ===== */
let planning=false,again=false;
async function replan(){
  if(!today)return;
  if(planning){again=true;return}
  planning=true;
  try{do{again=false;await doPlan()}while(again&&today)}catch(e){}
  planning=false;
  if(today){today.planAt=Date.now();save();safeRender()}
}
async function doPlan(){
  if(!today)return;
  const stops=today.stops,pend=stops.filter(s=>s.status!=='done');
  const D=await depotPos();
  const dn=stops.filter(s=>s.status==='done'&&s.pos).sort((a,b)=>b.doneAt-a.doneAt)[0];
  const from=dn?dn.pos:D;
  if(!from||!pend.length){today.remKm=0;today.endEta=null;return}
  const wp=[from],items=[];
  for(const s of pend){
    const p=await itemPos(s,D);if(!today)return;
    if(p){wp.push(p);items.push(s)}else{s.eta=null;s.planKm=null;s.planMin=null}
  }
  if(!items.length){today.remKm=0;today.endEta=null;return}
  const legs=await legsOf(wp);if(!today)return;
  let t=Date.now(),km=0,ap=false,aptDone=null;
  items.forEach((s,i)=>{const L=legs[i];km+=L.km;ap=ap||L.approx;s.planKm=L.km;s.planMin=L.min;s.planSrc=L.src;
    s.planPred=predDrive(L.min,L.src,s,L.km<0.05);t+=s.planPred*6e4;s.eta=t;t+=svcMs(s);s.etaDone=t;if(s.type!=='depot')aptDone=t});
  today.remKm=km;today.planApprox=ap;today.planSrc=legs[0]&&legs[0].src;today.aptDoneEta=aptDone;
  pend.forEach((s,i)=>{if(i>0){delete s.legPlanMin;delete s.legPlanKm;delete s.legPlanEta;delete s.svcPlanMin;delete s.legPlanSrc;delete s.legPlanPred}});
  const f0=pend[0];
  if(f0&&f0.planMin!=null&&f0.legPlanEta==null){f0.legPlanMin=f0.planMin;f0.legPlanKm=f0.planKm;f0.legPlanEta=f0.eta;f0.svcPlanMin=svcMs(f0)/6e4;f0.legPlanSrc=f0.planSrc;f0.legPlanPred=f0.planPred}
  const last=items[items.length-1];
  today.endEta=(last.type==='depot'&&last.kind==='end')?last.eta:t;
}

/* ===== munka / műszak ===== */
const addrKeyOf=s=>{const a=getApt(s);return a&&a.address?parseAddr(a.address).full:''};
// Ugyanazon a címen lévő, még nem kész lakások összevonása egyetlen megállóvá
function mergeStops(lead){
  const k=addrKeyOf(lead);if(!k||!today)return 0;
  const grp=today.stops.filter(s=>s.status!=='done'&&s.type!=='depot'&&addrKeyOf(s)===k);
  if(grp.length<2)return 0;
  const keep=grp[0],members=[];
  grp.forEach(s=>members.push(...(s.members||[s.name])));
  keep.members=members;keep.name=members.join(', ');
  keep.packs=grp.reduce((t,s)=>t+(s.packs||1),0);
  const ug=grp.find(s=>s.urgent);if(ug)keep.urgent=ug.urgent;
  keep.vnote=grp.map(s=>s.vnote).filter(Boolean).join(' · ')||keep.vnote;
  today.stops=today.stops.filter(s=>s===keep||!grp.includes(s));
  return members.length;
}
function autoMerge(){
  if(!today)return;
  let again=true;
  while(again){again=false;
    for(const s of today.stops){
      if(s.status==='done'||s.type==='depot')continue;
      const k=addrKeyOf(s);
      if(k&&cfg.mergeAddr[k]&&today.stops.some(x=>x!==s&&x.status!=='done'&&x.type!=='depot'&&addrKeyOf(x)===k)){mergeStops(s);again=true;break}
    }
  }
}
function splitStop(s){

function newDay(names,date,append,urgent){

  t=t.replace(/^﻿/,'');
  const first=t.split(/\r?\n/)[0]||'';
  const d=force||[';','\t',','].map(c=>[c,first.split(c).length-1]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function sheetRows(ws){
  const out=[];if(!ws||!ws['!ref'])return out;
  const R=XLSX.utils.decode_range(ws['!ref']);
  for(let r=R.s.r;r<=R.e.r;r++){
    const row=[];
    for(let c=R.s.c;c<=R.e.c;c++){
      const cell=ws[XLSX.utils.encode_cell({r,c})];
      row.push(cell?{t:cell.w!=null?String(cell.w):(cell.v!=null?String(cell.v):''),l:(cell.l&&cell.l.Target)||''}:{t:'',l:''});
    }
    out.push(row);
  }
  return out;
}
function importBuffer(buf){
  const u=new Uint8Array(buf);
  const bin=(u[0]===0x50&&u[1]===0x4B)||(u[0]===0xD0&&u[1]===0xCF);
  let sets,hasLinks=false;
  if(bin){
    if(typeof XLSX==='undefined')throw new Error('Az Excel-olvasó nem töltődött be (nincs net?)');
    const wb=XLSX.read(u,{type:'array'});hasLinks=true;
    sets=wb.SheetNames.map(nm=>({rows:sheetRows(wb.Sheets[nm]),old:/r[eé]gi|archiv|old/i.test(nm)}));
    sets.sort((a,b)=>a.old-b.old);
  }else{
    let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){txt=new TextDecoder('windows-1250').decode(u)}
    if(/^\s*<(!doctype|html)/i.test(txt))throw new Error('a link nem táblázatot adott vissza – ellenőrizd a megosztást');
    sets=[{rows:parseCSV(txt),old:false}];
  }
  const r={n:0,changed:0},seen=new Set();
  for(const s of sets){const x=importRows(s.rows,{old:s.old,hasLinks,seen});r.n+=x.n;r.changed+=x.changed}
  if(!r.n)throw new Error('nem találtam lakás-sorokat a táblázatban');
  r.links=hasLinks;
  LS.set('dataAt',Date.now());
  return r;
}
function importText(txt){
  txt=String(txt||'');
  if(!txt.trim())throw new Error('üres a beillesztett szöveg');
  const rows=parseCSV(txt,txt.includes('\t')?'\t':null);
  const r=importRows(rows,{old:false,hasLinks:false,seen:new Set()});
  if(!r.n)throw new Error('nem találtam lakás-sorokat – a fejléc-sort (Lakás, Kapukód…) is másold ki');
  LS.set('dataAt',Date.now());
  return r;
}
function afterImport(r,how){

async function importFile(f){
  try{
    const r=importBuffer(await f.arrayBuffer());
    save();render();toast(`${r.n} lakás betöltve${r.changed?` · 🔄 ${r.changed} kód változott`:''}`);
  }catch(e){toast('Nem sikerült beolvasni: '+e.message)}
}
function gsUrls(u){
  const m=u.match(/docs\.google\.com\/spreadsheets\/d\/(?!e\/)([\w-]+)/);
  if(m&&!/\/pub/.test(u)){const g=u.match(/[#?&]gid=(\d+)/);
    return[`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`,`https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv${g?'&gid='+g[1]:''}`]}
  const p=u.match(/docs\.google\.com\/spreadsheets\/d\/e\/([\w-]+)\/pub/);
  if(p)return[`https://docs.google.com/spreadsheets/d/e/${p[1]}/pub?output=xlsx`,u];
  return[u];
}
let syncing=false,lastSyncTry=0;
async function syncData(manual){
  if(!cfg.dataUrl){if(manual)toast('Nincs adatbázis-link megadva (Beállítások)');return false}
  if(syncing)return false;
  syncing=true;lastSyncTry=Date.now();
  let err='';
  try{
    if(manual)toast('Adatbázis frissítése…',1);
    for(const url of gsUrls(cfg.dataUrl)){
      try{
        const r=await fetch(url,{cache:'no-store'});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const res=importBuffer(await r.arrayBuffer());
        save();safeRender();
        const lk=res.links?'':' (segédlet-linkek nélkül)';
        if(res.changed)toast(`🔄 ${res.changed} lakás kódja megváltozott${lk}`);
        else if(manual)toast(`Adatbázis frissítve · ${res.n} lakás${lk}`);
        return true;
      }catch(e){err=e.message}
    }
    throw new Error(err);
  }catch(e){toast('Adatbázis-frissítés sikertelen: '+e.message+' – a korábbi adatok maradnak');return false}
  finally{syncing=false}
}
function dataStatus(){

  return{ok:same,txt:same?`ma ${fmtT(t)}-kor frissítve`:`${dd} napja frissítve (${new Date(t).toLocaleDateString('hu-HU')})`};
}

function wazeUrl(a){
  if(!a||!a.address)return null;
  const p=parseAddr(a.address);
  // Wazének egyszerű házszám: „31-33a” → 31 (a tartományt / betűt nem mindig érti)
  const n=/[-–]/.test(p.num)?(p.num.match(/\d+/)||[''])[0]:p.num;
  const q=p.street?(p.pc?p.pc+' ':'')+(p.town?p.town+', ':'')+[p.street,n].filter(Boolean).join(' '):a.address;
  const ll=a.lat&&(a.geoManual||(a.geoOk&&a.geoPrecise&&a.geoV===GEO_V))?`&ll=${a.lat},${a.lon}`:'';
  return'https://waze.com/ul?q='+encodeURIComponent(q)+'&navigate=yes'+ll;
}

  pend.forEach((s,i)=>{
    if(startRound&&s.type!=='depot'){h+=`<div class="rnd">${r}. kör · 📦 ${roundPacks(i)} csomag</div>`;startRound=false}
    sameSet[s.id]=i>0&&s.type!=='depot'&&pend[i-1].type!=='depot'&&sameAddr(pend[i-1],s);
    if(s.type!=='depot'&&!sameSet[s.id]){let n=(s.members||[1]).length,f=0;for(let j=i+1;j<pend.length&&pend[j].type!=='depot'&&sameAddr(s,pend[j]);j++){n+=(pend[j].members||[1]).length;f++}groupLead[s.id]=f?n:0}
    h+=stopCard(s);

  return h+pasteBox(true);
}

function monthCard(){

    ${R('Lakások',`${apt} <span class="mut small">(${n?(apt/n).toFixed(1).replace('.',','):0}/nap)</span>`)}${R('Lakás / óra',h>=0.5?(apt/h).toFixed(1).replace('.',','):'–')}

    ${R('⚡ Sürgős lakások',urg)}${R('⚠ Problémák · 🔑 nálam maradt',`${probs} · ${keys}`)}
    ${(()=>{let W=null,C=null,wc=0,cc=0,nW=0;for(const d of D){const F=dayFuel(d);if(!F)continue;if(F.work){W=addSeg(W,F.work);if(F.wc!=null){wc+=F.wc;nW++}}if(F.comm){C=addSeg(C,F.comm);if(F.cc!=null)cc+=F.cc}}

}

/* ⛽ Autó: km-óra + a kijelző kWh és benzin (L) számlálója 4 ponton:
   🏠 indulás otthonról → ▶ munka indítása (mosoda) → ⏹ munka vége (mosoda) → 🏠 hazaérés.
   A számlálókat nem kell nullázni: a különbségekből számol. Munka = indítás→vége, ingázás = a két otthoni szakasz. */
const METER_PTS={home0:'🏠 Indulás otthonról',start:'▶ Munka indítása (mosoda)',end:'⏹ Munka vége (mosoda)',home1:'🏠 Hazaérkezés'};
const numIn=v=>{v=String(v??'').replace(/\s/g,'').replace(',','.');if(v==='')return null;const n=+v;return isFinite(n)?n:null};
const fmtN=(x,d)=>x==null?'–':(+x).toFixed(d).replace('.',',');
const fmtFt=x=>Math.round(x).toLocaleString('hu-HU')+' Ft';
function dayByDate(dt){return today&&today.date===dt?today:days.find(d=>d.date===dt)||null}
function fuelSeg(a,b){
  if(!a||!b)return null;const r={};let any=false;
  for(const f of['km','kwh','l'])if(a[f]!=null&&b[f]!=null){const v=+(b[f]-a[f]).toFixed(3);if(v>=0){r[f]=v;any=true}else r.reset=true}
  return any||r.reset?r:null;
}
function addSeg(x,y){if(!x)return y;if(!y)return x;const r={};for(const f of['km','kwh','l'])if(x[f]!=null||y[f]!=null)r[f]=(x[f]||0)+(y[f]||0);r.reset=x.reset||y.reset;r.partial=!(x&&y);return r}
function segCost(r,p){if(!r)return null;p=p||{};let c=0,ok=false;
  if(r.kwh!=null&&p.kwh){c+=r.kwh*(1+(+p.loss||0)/100)*p.kwh;ok=true}
  if(r.l!=null&&p.l){c+=r.l*p.l;ok=true}
  return ok?c:null}
const curPrices=()=>({kwh:numIn(cfg.elecPrice),l:numIn(cfg.fuelPrice),loss:numIn(cfg.chargeLoss)??10});
function dayFuel(d){
  const m=d&&d.meter;if(!m)return null;
  const p=d.prices||curPrices();
  const work=fuelSeg(m.start,m.end);
  const c1=fuelSeg(m.home0,m.start),c2=fuelSeg(m.end,m.home1);
  const comm=c1||c2?addSeg(c1,c2):null;if(comm&&(!c1||!c2))comm.partial=true;
  return{work,comm,p,wc:segCost(work,p),cc:segCost(comm,p)};
}
function segTxt(r,c){
  if(!r)return'nincs leolvasás';
  return`${r.km!=null?fmtN(r.km,0)+' km':''}${r.kwh!=null?' · '+fmtN(r.kwh,1)+' kWh':''}${r.l!=null?' · '+fmtN(r.l,2)+' L':''}${c!=null?' · <b>'+fmtFt(c)+'</b>':''}${r.km&&c!=null?' <span class="mut">('+fmtN(c/r.km,1)+' Ft/km)</span>':''}${r.reset?' <span class="warn">⚠ egy számláló közben nullázódott</span>':''}${r.partial?' <span class="mut">(csak az egyik út)</span>':''}`;
}
function fuelLines(d){
  const F=dayFuel(d);if(!F||(!F.work&&!F.comm))return'';
  return`<div class="fuel">⛽ <b>Munka:</b> ${segTxt(F.work,F.wc)}<br>🏠 <b>Ingázás:</b> ${segTxt(F.comm,F.cc)}${F.wc!=null||F.cc!=null?`<br>Összesen: <b>${fmtFt((F.wc||0)+(F.cc||0))}</b>`:''}${!F.p.kwh||!F.p.l?' <span class="warn">– add meg az áram- és benzinárat a Beállításokban</span>':''}</div>`;
}

function saveMeter(){
  const m=ui.modal,r={km:numIn(($('#mKm')||{}).value),kwh:numIn(($('#mKwh')||{}).value),l:numIn(($('#mL')||{}).value),at:Date.now()};
  if(r.km==null&&r.kwh==null&&r.l==null){toast('Nem írtál be semmit');return}
  const d=m.date?dayByDate(m.date):null;
  if(!d){LS.set('meterPending',r);LS.set('meterLast',r);ui.modal=null;render();toast('🏠 Elmentve – a mai naphoz csatolom, amint megjön a lista');return}
  const order=['home0','start','end','home1'],prev=d.meter?order.slice(0,order.indexOf(m.which)).reverse().map(k=>d.meter[k]).find(x=>x&&x.km!=null):null;
  if(prev&&r.km!=null&&r.km<prev.km&&!confirm(`A km-óra (${fmtN(r.km,0)}) kevesebb, mint az előző (${fmtN(prev.km,0)}). Biztosan jó?`))return;
  d.meter=d.meter||{};d.meter[m.which]=r;if(d===today||!d.prices)d.prices=curPrices(); // lezárt nap árát nem írja át
  LS.set('meterLast',r);ui.modal=null;save();render();
  const F=dayFuel(d);
  if(m.which==='end'&&F&&F.work)toast('⛽ Munka: '+segTxt(F.work,F.wc).replace(/<[^>]+>/g,''));
  else if(m.which==='home1'&&F&&F.comm)toast('🏠 Ingázás: '+segTxt(F.comm,F.cc).replace(/<[^>]+>/g,''));
  else toast('⛽ Elmentve');
}

}

const SUFX=['','BA','BE','BAN','BEN','RA','RE','NAK','NEK','HOZ','HEZ','BOL','ROL','TOL','NAL','NEL','T','ON','EN','N','I','OS','ES'];
function looksLikeList(text){
  if(/^\s*\d{4}\.\s?\d{2}\.\s?\d{2}/m.test(text))return true;
  const L=String(text).split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('@'));
  if(!L.length)return false;
  const hit=L.filter(x=>{const n=x.replace(/[^\p{L}\p{N}\s.\-]/gu,'').trim();return n&&n.length<=24&&n.split(/\s+/).length<=3&&findApt(n)}).length;
  return hit/L.length>=0.5;
}
// lakásnév keresése egy szabad szövegben: „Tok 1 …” → TÖK-1, „Bokrétába …” → BOK
function detectApt(text){
  const w=String(text).replace(/[^\p{L}\p{N}\s-]/gu,' ').split(/\s+/).filter(Boolean);
  const E=Object.entries(apts).flatMap(([k,a])=>[k,...(a.aliases||[])].map(x=>({x,k,a})));
  let best=null;
  for(let i=0;i<w.length;i++){
    const cands=[];if(w[i+1]&&/^\d+$/.test(w[i+1]))cands.push(norm(w[i]+w[i+1]));if(w[i+1]&&/^\d+-\d+$/.test(w[i+1]))cands.push(norm(w[i]+w[i+1]));cands.push(norm(w[i]));
    for(const c of cands){if(c.length<3)continue;
      for(const e of E){if(e.x.length<3)continue;
        let sc=0;if(c===e.x)sc=100+e.x.length;else if(c.startsWith(e.x)&&SUFX.includes(c.slice(e.x.length))&&!/\d$/.test(e.x))sc=50+e.x.length;
        if(sc&&e.a.old)sc-=20;
        if(sc&&(!best||sc>best.sc))best={sc,a:e.a};
      }}
  }
  return best&&best.a;
}
function processSharedText(text){
  if(!looksLikeList(text)&&!(text.includes('\t')&&text.split('\n').length>3)){
    const a=detectApt(text);
    ui.modal={kind:'todo',apt:a?a.name:'',text:text.trim()};ui.tab='today';render();return;
  }
  if(text.includes('\t')&&text.split('\n').length>3){try{afterImport(importText(text),'Megosztott táblázat')}catch(e){toast('Nem sikerült: '+e.message)}return}
  const{date,names,urgent}=parseMsg(text);
  ui.tab='today';
  if(!names.length){toast('A megosztott szövegben nem találtam lakásneveket');return}
  if(!today){loadDay(names,date,false,urgent);return}
  if(!date||date===today.date){
    if(confirm(`${names.length} lakás érkezett. Hozzáadjam a mai listához?`)){loadDay(names,date,true,urgent);return}
  }else if(confirm(`Új napi lista érkezett (${date}). A(z) ${today.date} napot lezárjam, és az újat kezdjem?`)){
    if(today.stops.some(s=>s.status==='done')){today.endedAt=today.endedAt||Date.now();days.unshift(today)}
    today=null;save();loadDay(names,date,false,urgent);return;
  }
  ui.paste=text;render();toast('Az üzenet a beillesztő mezőbe került');
}
migrate();
render();
handleShare();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.onLine){
  checkUpdate(true);
  if(cfg.dataUrl)syncData(false);
  if(today){replan();fillLegs()}
}
</script>
</body>
</html>
